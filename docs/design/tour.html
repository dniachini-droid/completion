<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three Ways Down</title><link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:dark;--ground:#07080b;--panel:#151922;--line:#2a3040;--ink:#ece8df;--dim:#a3a8b4;--love:#f0a24a}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:"Spectral",Georgia,serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.dirs{display:flex;gap:6px;flex:1}
.dirs button{flex:1;font:inherit;font-family:"Marcellus",Georgia,serif;font-size:13px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer}
.dirs button[aria-pressed="true"]{color:var(--ink);border-color:var(--dim);background:#1f2433}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0}
.phone{position:relative;width:390px;height:844px;transform-origin:center center;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px #2a3040,0 20px 60px rgba(0,0,0,.6)}
iframe{border:0;width:390px;height:844px;display:block;background:#000}
.foot{display:flex;flex-direction:column;gap:6px;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.name{text-align:center;font-size:15px;color:var(--dim);min-height:1.4em}
.name b{color:var(--ink);font-weight:500}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.ctrl button{font:inherit;font-size:16px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;padding:0 14px}
.ctrl .next{background:var(--love);border-color:var(--love);color:#1b1206;font-weight:500}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:#3a4152;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink)}
button:focus-visible{outline:2px solid #b9c6e8;outline-offset:2px}
</style></head><body>
<div class="bar"><div class="dirs" role="group" aria-label="Direction">
<button data-d="d">D · Combined</button><button data-d="a">A · Lamp</button><button data-d="b">B · Engraved</button><button data-d="c">C · Turning</button></div></div>
<div class="stage" id="stage"><div class="phone" id="phone"><iframe id="f" title="Screen"></iframe></div></div>
<div class="foot">
<div class="name" id="name"></div>
<div class="dots" id="dots"></div>
<div class="ctrl"><button id="prev">‹ Back</button><button id="replay" title="Play this screen again">↻ Replay</button><button id="next" class="next">Next ›</button></div>
</div>
<script>
const D={d:"d-combined",a:"a-lamp-and-stone",b:"b-engraved-light",c:"c-turning-day"};
const N={d:"D · The combined look",a:"A · Lamp and Stone",b:"B · Engraved Light",c:"C · The Turning Day"};
const BASE=[["morning","Morning"],["delve","A delve (timer)"],["map","The map"],["record","Reading a record"],["cut","Cutting a word (animated)"],["complete","Day complete (animated)"],["camp","Camp"],["satchel","The satchel"],["daybook","The daybook"]];
const EXTRA={d:[[6,"stair","The head of the stair"]],a:[[1,"morning-violet","Morning, violet version"]],b:[[6,"stair","The head of the stair"]],c:[]};
function list(d){const l=BASE.slice();for(const [i,s,t] of EXTRA[d].slice().reverse()) l.splice(i,0,[s,t]);return l}
let d="d",i=0;
try{const h=location.hash.slice(1).split("-");if(D[h[0]]){d=h[0];i=Math.max(0,+h[1]||0)}}catch(e){}
const f=document.getElementById("f");
function fit(){const st=document.getElementById("stage");const s=Math.min(st.clientWidth/390,st.clientHeight/844,1.2);document.getElementById("phone").style.transform=`scale(${s})`;document.getElementById("phone").style.margin=`${(844*s-844)/2}px ${(390*s-390)/2}px`}
function go(){const l=list(d);i=(i+l.length)%l.length;f.src=`directions/${D[d]}/${l[i][0]}.html`;
document.getElementById("name").innerHTML=`<b>${N[d]}</b> — ${l[i][1]} <span style="color:#6f7584">(${i+1} of ${l.length})</span>`;
document.querySelectorAll(".dirs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===d));
const dots=document.getElementById("dots");dots.innerHTML="";l.forEach((x,k)=>{const b=document.createElement("button");b.setAttribute("aria-label",x[1]);if(k===i)b.setAttribute("aria-current","true");b.onclick=()=>{i=k;go()};dots.append(b)});
history.replaceState(null,"",`#${d}-${i}`)}
document.querySelectorAll(".dirs button").forEach(b=>b.onclick=()=>{const cur=list(d)[i][0];d=b.dataset.d;const k=list(d).findIndex(x=>x[0]===cur);i=k>=0?k:(cur==="morning-violet"?0:Math.min(i,list(d).length-1));go()});
document.getElementById("prev").onclick=()=>{i--;go()};
document.getElementById("next").onclick=()=>{i++;go()};
document.getElementById("replay").onclick=()=>{f.src=f.src};
addEventListener("resize",fit);addEventListener("keydown",e=>{if(e.key==="ArrowRight"){i++;go()}if(e.key==="ArrowLeft"){i--;go()}});
fit();go();
</script></body></html>
