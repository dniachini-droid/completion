<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>The map · The Quiet</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.head{top:52px;left:var(--gutter);right:var(--gutter)}
.lbl{position:absolute;z-index:3;font-family:var(--carve);font-size:13.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
  text-shadow:0 1px 3px #000,0 0 12px #000;white-space:nowrap;line-height:1.2}
.lbl small{display:block;font-family:var(--voice);font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:3px}
.lbl.w{color:#f6dcb6}
.lbl.w small{color:#d7ae80}
.lbl.c{color:var(--cold-hi)}
.lbl.c small{color:#93b5c6}
.lbl.here{color:#fff2dc;font-size:15px}
.lbl.faint{color:#6d8591}
.lbl.faint small{color:#5f7682}
.need{display:inline-flex;align-items:center;gap:6px}
.need svg{width:22px;height:10px}
.next{left:var(--gutter);right:var(--gutter);top:634px}
.next .row{display:flex;align-items:center;gap:16px;margin-top:10px}
.next .t{flex:1;font-family:var(--carve);font-weight:500;font-size:19px;line-height:1.2;color:#f5f1ea}
.next .warm-btn{height:52px;padding:0 26px;font-size:15px}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844;
  var x=c.getContext('2d'); c.width=W*2; c.height=H*2; x.scale(2,2);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(0,0,W,H);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
