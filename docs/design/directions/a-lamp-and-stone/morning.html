<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Morning · The Lamp Hall</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.head{top:46px;left:var(--gutter);right:10px}
.head .row{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.where{font-family:var(--carve);font-size:13.5px;font-weight:500;letter-spacing:.15em;white-space:nowrap;text-transform:uppercase;color:var(--ink-3)}
.where b{font-weight:600;color:var(--ink);text-shadow:0 0 16px rgba(159,196,216,.3)}
.where i{font-style:normal;margin:0 .45em;opacity:.6}
.maplink{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;
  font-family:var(--carve);font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cold);text-shadow:0 0 12px rgba(159,196,216,.35)}
.maplink svg{width:26px;height:20px}
.cap{display:flex;align-items:center;margin-left:-10px;margin-top:-4px}
.cap button{height:44px;padding:0 8px;font-family:var(--carve);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#71858f;position:relative}
.cap button[aria-pressed=true]{color:var(--ink-2)}
.cap button[aria-pressed=true]::after{content:"";position:absolute;left:50%;bottom:7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#ffd59a;box-shadow:0 0 6px 2px rgba(240,162,74,.55)}
.cap span{font-family:var(--voice);font-size:14.5px;color:#7a8e98;margin-left:2px;white-space:nowrap}
.ahead{right:22px;top:156px;width:190px;text-align:right}
.ahead .say{font-size:17px;line-height:1.32;color:var(--ink-2);margin-top:5px}
.ahead .say .c{color:var(--cold-hi)}
.day{left:var(--gutter);right:var(--gutter);top:396px}
.day .title{margin-top:10px}
.teaser{margin-top:8px;font-family:var(--voice);font-size:17px;letter-spacing:-.005em;line-height:1.35;color:var(--warm-hi);text-shadow:0 0 18px rgba(240,162,74,.25)}
.acts{display:flex;align-items:center;gap:16px;margin-top:22px}
.acts .warm-btn{flex:1}
.acts .quiet-btn{padding:0 10px}
.rest{margin-top:20px;list-style:none}
.rest li{display:flex;align-items:center;gap:12px;min-height:44px}
.rest .t{font-family:var(--voice);font-size:17.5px;color:var(--ink-2);flex:1}
.rest .s{font-family:var(--voice);font-size:16px;color:var(--ink-3)}
.rest li.done .t{color:#a9b6bc}
.rest li.done .s{color:#dcae78}
.cant{left:0;right:0;top:722px;display:flex;justify-content:center}
.nav{height:64px;padding-bottom:10px}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844;
  var x=c.getContext('2d'); c.width=W*2; c.height=H*2; x.scale(2,2);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(0,0,W,H);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
