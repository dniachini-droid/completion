<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Morning · The Lamp Hall</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.head .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px}
.where{font-family:var(--carve);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-shadow:0 1px 3px #000}
.where b{font-weight:600;color:var(--ink);text-shadow:0 0 16px rgba(159,196,216,.35),0 1px 3px #000}
.where i{font-style:normal;margin:0 .4em;opacity:.7}
.maplink{display:flex;align-items:center;height:48px;margin-right:-10px;padding:0 10px;font-family:var(--voice);font-size:17px;color:var(--cold);text-shadow:0 0 12px rgba(159,196,216,.4),0 1px 3px #000}
.cap{display:flex;align-items:center;gap:2px;margin-left:-10px}
.cap button{position:relative;height:44px;padding:0 10px;font-family:var(--voice);font-size:17px;color:var(--ink-3);text-shadow:0 1px 3px #000}
.cap button[aria-pressed=true]{color:var(--ink)}
.cap button[aria-pressed=true]::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#ffd59a;box-shadow:0 0 7px 2px rgba(240,162,74,.6)}
.capnote{font-family:var(--voice);font-size:15px;color:var(--ink-3);margin-top:-2px;text-shadow:0 1px 3px #000}
.ahead{right:var(--gutter);top:21.5%;width:52%;text-align:right}
.ahead .say{font-size:17px;line-height:1.3;margin-top:4px}
.day .title{margin-top:8px}
.teaser{margin-top:6px;font-family:var(--voice);font-size:17.5px;line-height:1.35;color:var(--warm-hi);text-shadow:0 0 16px rgba(240,162,74,.25),0 1px 3px #000}
.acts{display:flex;align-items:center;gap:10px;margin-top:14px}
.acts .warm-btn{flex:1}
.rest{margin-top:10px;list-style:none}
.rest li a,.rest li>span{display:flex;align-items:center;gap:12px;min-height:44px}
.rest .t{font-family:var(--voice);font-size:17.5px;color:var(--ink-2);flex:1}
.rest .s{font-family:var(--voice);font-size:16px;color:var(--ink-3)}
.rest li.done .s{color:#e2b47e}
.rest li a .s{color:var(--cold)}
.cant{display:flex;justify-content:center;margin-top:2px}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only.
   Light positions are in the painting's 390x844 space; the painting is cropped to fill the screen. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844, x=c.getContext('2d'), k=1, ox=0, oy=0;
  function size(){ var w=c.clientWidth, h=c.clientHeight; c.width=w*2; c.height=h*2; k=Math.max(w/W,h/H); ox=(w-W*k)/2; oy=(h-H*k)/2; x.setTransform(2*k,0,0,2*k,2*ox,2*oy); }
  size(); addEventListener('resize', size);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(-ox/k,-oy/k,W+2*ox/k,H+2*oy/k);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
