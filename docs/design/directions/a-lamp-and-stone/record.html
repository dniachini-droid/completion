<meta name="color-scheme" content="dark">
<title>A record · The long tally</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.head{top:104px;left:var(--gutter);right:var(--gutter)}
.head .title{margin-top:8px}
.head .say{margin-top:6px;font-size:17px;color:var(--ink-3)}
.guesses{position:absolute;z-index:3;left:0;right:0;top:438px;height:40px}
.g{position:absolute;transform:translateX(-50%);font-family:var(--voice);font-size:17px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 10px #000}
.g.guess{color:#f3c68c}
.g.known{color:#ffe0b2;text-shadow:0 0 12px rgba(240,162,74,.5),0 1px 3px #000}
.g.name{color:#a9c9d8;font-size:15.5px}
.g.unk{color:#5f7885}
.line{left:var(--gutter);right:var(--gutter);top:522px;text-align:center}
.line .say{font-size:19px;color:var(--ink)}
.hint{left:0;right:0;top:580px;text-align:center}
.act{left:var(--gutter);right:var(--gutter);bottom:54px;display:flex;flex-direction:column;align-items:center;gap:6px}
.act .warm-btn{width:100%}
.ringname{animation:ringwake 3.2s var(--slow) .6s both}
@keyframes ringwake{from{opacity:.2}to{opacity:1}}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844;
  var x=c.getContext('2d'); c.width=W*2; c.height=H*2; x.scale(2,2);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(0,0,W,H);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
