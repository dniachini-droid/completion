<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>A record · The long tally</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.head .title{margin-top:6px}
.line{display:flex;justify-content:space-between;align-items:flex-start;margin:0}
.mk{position:relative;display:flex;flex-direction:column;align-items:center;width:16.6%;min-width:48px;padding:4px 0 2px;border-radius:16px}
.mk svg{width:48px;height:48px;overflow:visible}
.mk.ring svg{width:58px;height:58px;margin:-5px 0}
.mk .g{margin-top:6px;min-height:24px;font-family:var(--voice);font-size:16px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 10px #000}
.g.guess{color:#f3c68c}
.g.known{color:#ffe0b2;text-shadow:0 0 12px rgba(240,162,74,.5),0 1px 3px #000}
.g.name{color:var(--cold)}
.g.unk{color:var(--ink-3)}
.mk.invite::before,.mk[aria-pressed=true]::before{content:"";position:absolute;left:50%;top:28px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(240,162,74,.26), rgba(240,162,74,0));animation:breathe 3.6s ease-in-out infinite;pointer-events:none}
.mk[aria-pressed=true] .g{color:var(--warm-hi)}
.ask{margin-top:16px;text-align:center;min-height:120px}
.ask .q{font-family:var(--voice);font-size:17px;color:var(--ink-2);text-shadow:0 1px 3px #000}
.cands{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.cand{position:relative;min-height:52px;padding:0 16px;font-family:var(--voice);font-size:20px;color:#fff0d8;isolation:isolate;
  text-shadow:0 0 10px rgba(255,190,110,.7),0 1px 2px #000}
.cand::before{content:"";position:absolute;inset:2px -2px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side, rgba(214,120,44,.5), rgba(214,120,44,0));}
.cand:active::before{background:radial-gradient(closest-side, rgba(255,190,110,.8), rgba(214,120,44,0))}
.ask .small{margin-top:4px}
.appline{text-align:center;margin-top:22px}
.appline .say{font-size:19px;color:var(--ink)}
.done{display:flex;justify-content:center;margin:6px 0 max(16px, env(safe-area-inset-bottom))}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only.
   Light positions are in the painting's 390x844 space; the painting is cropped to fill the screen. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844, x=c.getContext('2d'), k=1, ox=0, oy=0;
  function size(){ var w=c.clientWidth, h=c.clientHeight; c.width=w*2; c.height=h*2; k=Math.max(w/W,h/H); ox=(w-W*k)/2; oy=(h-H*k)/2; x.setTransform(2*k,0,0,2*k,2*ox,2*oy); }
  size(); addEventListener('resize', size);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(-ox/k,-oy/k,W+2*ox/k,H+2*oy/k);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
<script>
/* Reading and guessing: tap a mark to see its candidate meanings; tap one to guess. (Prototype interaction.) */
(function(){
  var marks=[].slice.call(document.querySelectorAll('.mk')), q=document.getElementById('q'), cands=document.getElementById('cands'), hint=document.getElementById('hint'), cur=marks[1];
  function select(m){
    marks.forEach(function(x){ x.removeAttribute('aria-pressed'); x.classList.remove('invite'); });
    cur=m; m.setAttribute('aria-pressed','true');
    var c=m.dataset.c, g=m.querySelector('.g');
    cands.innerHTML='';
    if(m.classList.contains('ring')){ q.textContent='A ring: someone’s name. You’ll know it before you can read it.'; hint.textContent=''; return; }
    if(!c){ q.textContent='You know this one: '+g.textContent+'.'; hint.textContent=''; return; }
    q.textContent = m.classList.contains('unknown') ? 'This one is new. What might it be?' : 'Your guess is '+g.textContent+' Change it?';
    hint.textContent='Pick one. It shows with a question mark until the place agrees.';
    c.split('|').forEach(function(w){ var b=document.createElement('button'); b.className='cand'; b.textContent=w; b.onclick=function(){ guess(w); }; cands.appendChild(b); });
  }
  function guess(w){
    var g=cur.querySelector('.g'); g.textContent=w+'?'; g.className='g guess';
    cur.classList.remove('unknown'); cur.classList.add('guess');
    q.textContent='Noted: '+w+'?'; cands.innerHTML=''; hint.textContent='The place will say, in time.';
  }
  marks.forEach(function(m){ m.addEventListener('click', function(){ select(m); }); });
  [].forEach.call(cands.querySelectorAll('.cand'), function(b){ b.onclick=function(){ guess(b.textContent); }; });
})();
</script>
