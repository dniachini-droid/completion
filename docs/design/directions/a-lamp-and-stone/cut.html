<title>Cutting a word · The lintel</title>
<link rel="stylesheet" href="../../fonts/fonts.css">

<style>

.hall{position:absolute;inset:0;transform-origin:320px 258px;animation:pull 2.2s var(--slow) 3.8s both}
@keyframes pull{from{transform:scale(1.4)}to{transform:scale(1)}}
.hall,.close{will-change:transform,opacity}
body:not(.go) *{animation-play-state:paused!important}
.close{position:absolute;inset:0;z-index:1;transform-origin:320px 258px;animation:closeout 1.5s var(--slow) 3.8s both}
@keyframes closeout{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
.close svg{display:block;width:100%;height:100%}
.groove{stroke-dasharray:1 1;stroke-dashoffset:1;animation:carve 1s cubic-bezier(.5,0,.3,1) both}
@keyframes carve{to{stroke-dashoffset:0}}
.spark{animation:spark 1s ease-out both}
@keyframes spark{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.s1{animation-name:spark1} .s2{animation-name:spark2}
@keyframes spark1{0%{opacity:0;transform:translate(-14px,6px)}20%{opacity:.9}100%{opacity:0;transform:translate(10px,-10px)}}
@keyframes spark2{0%{opacity:0;transform:translate(-14px,16px)}20%{opacity:.9}100%{opacity:0;transform:translate(12px,-6px)}}
.lockpair{transform-box:fill-box;transform-origin:center;animation:lock .7s var(--ease) both}
@keyframes lock{0%{transform:none}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.lockglow{animation:lockglow 1.2s ease-out both}
@keyframes lockglow{0%{opacity:0}30%{opacity:.9}100%{opacity:.35}}
.blankedge{animation:edge 1s ease-out 3.1s both}
@keyframes edge{to{stroke-dasharray:4 0;opacity:.8;stroke:#ffe2b0}}
.flash{animation:flash 1.4s ease-out both}
@keyframes flash{0%{opacity:0}25%{opacity:.45}100%{opacity:0}}
.wake{opacity:0;animation:wake 1.1s ease-out both}
@keyframes wake{0%{opacity:0;transform:translateY(2px)}40%{opacity:1}100%{opacity:1;transform:none}}
.open{opacity:0;animation:open 1.6s var(--slow) both}
@keyframes open{to{opacity:1}}

.guess{position:absolute;z-index:3;top:408px;left:0;right:0;height:30px;animation:closeout 1.5s var(--slow) 3.8s both;transform-origin:320px 258px}
.guess span{position:absolute;transform:translateX(-50%);font-family:var(--voice);font-size:19px;color:#f3c68c;text-shadow:0 1px 3px #000}
.guess i{font-style:normal;animation:qfade .8s ease-out 3.4s both}
@keyframes qfade{to{opacity:0}}
.cutting{position:absolute;z-index:3;top:140px;left:0;right:0;text-align:center;animation:closeout 1.2s var(--slow) 3.5999999999999996s both}
.after{left:var(--gutter);right:var(--gutter);top:540px;text-align:center}
.after .rise{animation-delay:6.3s}
.word{display:flex;justify-content:center;align-items:center;gap:2px;height:64px}
.word svg{width:120px;height:64px}
.after .title{margin-top:4px}
.after .say{margin-top:10px}
.after .warm-btn{margin:26px auto 0;width:100%}
.home{animation:fadein .8s ease 6.3s both}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844;
  var x=c.getContext('2d'); c.width=W*2; c.height=H*2; x.scale(2,2);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(0,0,W,H);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
