<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>A delve</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.top{text-align:center;margin-top:6px}
.top .title{margin-top:6px}
.top .say{margin-top:2px;font-size:17px;color:var(--ink-3)}
.ring{animation:fadein 1s ease both;left:50%;top:47.39%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%);display:block}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .numerals{font-size:clamp(48px,14vw,58px);line-height:1;color:#fff4e4;text-shadow:0 0 22px rgba(240,162,74,.45),0 2px 3px rgba(0,0,0,.9)}
.ring .left{margin-top:6px;font-size:17px;color:#f3d3a8;text-shadow:0 1px 3px #000}
.below{text-align:center;text-wrap:balance}
.below .say{font-size:18px;color:var(--ink-2)}
.below .say + .say{margin-top:6px;color:var(--ink-3);font-size:17px}
.stop{display:flex;flex-direction:column;align-items:center;margin:14px 0 max(18px, env(safe-area-inset-bottom))}
.stop .small{margin-top:-6px}
#walker{transform-box:view-box;transform-origin:195px 408px;animation:walk 240s linear both}
@keyframes walk{from{transform:none}to{transform:translate(0,-26px) scale(.62)}}
/* the breather: the delve's end, a short pause that ends by itself */
.breather{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;justify-content:flex-end;padding:var(--top) var(--gutter) max(24px, env(safe-area-inset-bottom));
  background:radial-gradient(ellipse 70% 40% at 50% 42%, rgba(240,162,74,.26), rgba(5,8,11,0) 70%) #05080b}
.breather:target{display:flex;animation:fadein .6s ease both}
.breather .title{margin-top:8px}
.breather .say{margin-top:8px}
.breather .warm-btn{margin-top:26px}
.breather .quiet-btn{align-self:center;margin-top:6px}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only.
   Light positions are in the painting's 390x844 space; the painting is cropped to fill the screen. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844, x=c.getContext('2d'), k=1, ox=0, oy=0;
  function size(){ var w=c.clientWidth, h=c.clientHeight; c.width=w*2; c.height=h*2; k=Math.max(w/W,h/H); ox=(w-W*k)/2; oy=(h-H*k)/2; x.setTransform(2*k,0,0,2*k,2*ox,2*oy); }
  size(); addEventListener('resize', size);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(-ox/k,-oy/k,W+2*ox/k,H+2*oy/k);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
<script>
/* Which job this delve is for (prototype: the morning's Begin passes ?job=cat). */
(function(){
  if(/[?&]job=cat/.test(location.search)){
    document.getElementById('job').textContent='Order the cat’s medication';
    document.getElementById('which').textContent='One delve, or less.';
  }
})();
/* The ring: time left counts down, the warm arc grows. Motion only. */
(function(){
  var total=1500, left=852, C=628.319;
  var t=document.getElementById('t'), arcs=document.querySelectorAll('.arc'), bead=document.querySelector('.bead');
  var start=performance.now()+5000;
  function draw(now){
    var l=Math.min(left,Math.max(0,left-(now-start)/1000)), fr=1-l/total;
    var m=Math.floor(l/60), s=Math.floor(l%60);
    t.textContent=m+':'+(s<10?'0':'')+s;
    for(var i=0;i<arcs.length;i++) arcs[i].setAttribute('stroke-dashoffset',(C*(1-fr)).toFixed(2));
    bead.setAttribute('transform','rotate('+(fr*360).toFixed(3)+')');
    requestAnimationFrame(draw);
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(draw);
})();
</script>
