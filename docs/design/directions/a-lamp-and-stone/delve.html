.ring{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.top{top:104px;left:var(--gutter);right:var(--gutter);text-align:center}
.top .title{margin-top:10px;font-size:26px}
.top .say{margin-top:4px;font-size:17px;color:var(--ink-3)}
.time{left:0;right:0;top:356px;text-align:center}
.time .numerals{font-size:56px;line-height:1;color:#fff4e4;text-shadow:0 0 22px rgba(240,162,74,.45),0 2px 3px rgba(0,0,0,.9);letter-spacing:.02em}
.time .small{margin-top:6px;font-size:17px;color:#f3d3a8;text-shadow:0 1px 3px #000,0 0 10px #000;letter-spacing:.04em}
.below{left:var(--gutter);right:var(--gutter);top:588px;text-align:center}
.below .say{font-size:18px;color:var(--ink-2)}
.below .say + .say{margin-top:6px;color:var(--ink-3);font-size:17px}
.stop{left:0;right:0;top:728px;display:flex;flex-direction:column;align-items:center}
.stop .small{font-size:15.5px;margin-top:-4px}
#walker{animation:walk 240s linear both}
@keyframes walk{from{transform:translate(0,0) scale(1)}to{transform:translate(0px,-26px) scale(.62)}}
#walker{transform-box:view-box;transform-origin:195px 414px}

</style>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844;
  var x=c.getContext('2d'); c.width=W*2; c.height=H*2; x.scale(2,2);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(0,0,W,H);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
<script>
/* The ring: time left counts down, the warm arc grows. Motion only. */
(function(){
  var total=1500, left=852, C=728.849, cx=195, cy=408;
  var t=document.getElementById('t'), arcs=document.querySelectorAll('.arc'), bead=document.querySelector('.bead');
  var start=performance.now()+5000;
  function draw(now){
    var l=Math.min(left,Math.max(0,left-(now-start)/1000)), fr=1-l/total;
    var m=Math.floor(l/60), s=Math.floor(l%60);
    t.textContent=m+':'+(s<10?'0':'')+s;
    for(var i=0;i<arcs.length;i++) arcs[i].setAttribute('stroke-dashoffset',(C*(1-fr)).toFixed(2));
    bead.setAttribute('transform','rotate('+(fr*360).toFixed(3)+' '+cx+' '+cy+')');
    requestAnimationFrame(draw);
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(draw);
})();
</script>
