<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Day complete · The Salt Gallery</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.scene{animation:dawn 1.6s ease-out 0s both}
@keyframes dawn{from{opacity:0}to{opacity:1}}
.world{transform-box:view-box;transform-origin:196px 330px;animation:pullback 3.4s var(--slow) 0s both}
@keyframes pullback{from{transform:scale(1.22)}to{transform:scale(1)}}
.saltlight{animation:saltwake 2.6s ease-in-out 1.0s both}
.unlit{animation:unlit 3s ease-in-out 0.6s both}
@keyframes unlit{from{opacity:.72}to{opacity:0}}
@keyframes saltwake{from{opacity:.15}to{opacity:1}}
.stone{animation:settle .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes settle{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.cairnglow{transform-box:fill-box;transform-origin:center;animation:cglow 2.4s ease-out 3.10s both}
@keyframes cglow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
body:not(.go) *{animation-play-state:paused!important}
.head{top:104px;left:0;right:0;text-align:center;animation-delay:2.5s}
.end{left:var(--gutter);right:var(--gutter);top:604px;text-align:center}
.end .title{font-size:31px;line-height:1.2}
.end .say{margin-top:6px}
.end .rise{animation-delay:3.9s}
.end .d5{animation-delay:4.25s}
.acts{display:flex;align-items:center;gap:14px;margin-top:22px}
.acts .warm-btn{flex:1;padding:0 18px;font-size:15.5px;letter-spacing:.16em}
.home{animation:fadein .8s ease 3.9s both}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844;
  var x=c.getContext('2d'); c.width=W*2; c.height=H*2; x.scale(2,2);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(0,0,W,H);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
<script>

  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){ if(document.readyState==='complete') go(); else addEventListener('load', go); });
})();
