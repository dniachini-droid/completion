<title>Day complete · The Salt Gallery</title>

<style>

.layer{position:absolute;inset:0}
.layer svg{display:block;width:100%;height:100%}
.base{will-change:transform;transform-origin:50% 35%}
.dim{position:absolute;inset:0;background:#05080b;opacity:.8;pointer-events:none}
.saltglow{position:absolute;left:18%;right:18%;top:8%;height:50%;border-radius:50%;background:radial-gradient(closest-side, rgba(220,240,250,.3), rgba(159,196,216,0));opacity:0;pointer-events:none}
.stone,.cairnglow{opacity:0}
.go .base{animation:pullback 3.2s var(--slow) both}
@keyframes pullback{from{transform:scale(1.14)}to{transform:scale(1)}}
.go .dim{animation:undim 2.6s ease-in-out 0.20s both}
@keyframes undim{from{opacity:.8}to{opacity:0}}
.go .saltglow{animation:saltwake 2.4s ease-in-out 0.6s both}
@keyframes saltwake{0%{opacity:0}60%{opacity:1}100%{opacity:.55}}
.go .stone{animation:settle .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes settle{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.cairnglow{transform-box:fill-box;transform-origin:center}
.go .cairnglow{animation:cglow 2.4s ease-out 2.80s both}
@keyframes cglow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.end{text-align:center}
.end .title{font-size:28px;line-height:1.25}
.end .say{margin-top:6px}
.end .eyebrow{margin-bottom:10px}
.end > *{opacity:0}
.go .end > *{animation:rise .9s var(--ease) both}
.go .end > :nth-child(1){animation-delay:3.4s} .go .end > :nth-child(2){animation-delay:3.6s} .go .end > :nth-child(3){animation-delay:3.8000000000000003s} .go .end > :nth-child(4){animation-delay:4.05s}
.acts{display:flex;align-items:center;gap:8px;margin:18px 0 max(16px, env(safe-area-inset-bottom))}
.acts .warm-btn{flex:1;padding:0 12px;font-size:15.5px;letter-spacing:.14em;white-space:nowrap}
.acts .quiet-btn{white-space:nowrap}
@media (max-width:370px){.acts .warm-btn{font-size:15px;letter-spacing:.16em}}
@media (prefers-reduced-motion: reduce){.dim{display:none} .stone,.cairnglow,.end > *{opacity:1} .saltglow{opacity:.55}}

</style>
</head>

<script>
/* Dust in the light: few, slow, lit only near a light source. Motion only.
   Light positions are in the painting's 390x844 space; the painting is cropped to fill the screen. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.querySelector('canvas.motes'); if(!c) return;
  var L=JSON.parse(c.dataset.lights||'[]'), N=+(c.dataset.n||30), W=390, H=844, x=c.getContext('2d'), k=1, ox=0, oy=0;
  function size(){ var w=c.clientWidth, h=c.clientHeight; c.width=w*2; c.height=h*2; k=Math.max(w/W,h/H); ox=(w-W*k)/2; oy=(h-H*k)/2; x.setTransform(2*k,0,0,2*k,2*ox,2*oy); }
  size(); addEventListener('resize', size);
  var R=Math.random, m=[];
  for(var i=0;i<N;i++) m.push({x:R()*W,y:R()*H,r:.35+R()*1.1,vx:(R()-.5)*.05,vy:-.02-R()*.06,p:R()*6.3});
  var last=performance.now();
  function fr(t){
    var dt=Math.min(50,t-last); last=t; x.clearRect(-ox/k,-oy/k,W+2*ox/k,H+2*oy/k);
    for(var i=0;i<m.length;i++){ var q=m[i];
      q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.p+=dt*.001;
      if(q.y<-4){q.y=H+4;q.x=R()*W} if(q.x<-4)q.x=W+4; if(q.x>W+4)q.x=-4;
      var best=0,col=null;
      for(var j=0;j<L.length;j++){var l=L[j],d=Math.hypot(q.x-l[0],q.y-l[1]),a=Math.max(0,1-d/l[2])*l[4]; if(a>best){best=a;col=l[3]}}
      var a=best*(.5+.4*Math.sin(q.p)); if(a<.02) continue;
      x.fillStyle=col==='w'?'rgba(255,214,150,'+a+')':'rgba(214,238,248,'+a+')';
      x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fill();
    }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();
</script>
<script>
/* Start once the first frame has painted, so the arrival is seen from its beginning.
   Review aid: ?t=2.5 holds the sequence at that second. */
(function(){
  function go(){ document.body.classList.add('go');
    var m=/[?&]t=([\d.]+)/.exec(location.search);
    if(m&&document.getAnimations){ var t=parseFloat(m[1])*1000; requestAnimationFrame(function(){ document.getAnimations().forEach(function(a){ a.pause(); a.currentTime=t; }); }); }
  }
  function painted(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(go, 350); }); }); }
  if(document.readyState==='complete') painted(); else addEventListener('load', painted);
})();
</script>
