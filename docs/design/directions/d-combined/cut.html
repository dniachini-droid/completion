<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>Cutting a word · The lintel</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

body { --wake0: .5s; --wakestep: .11s; }
.paint.over { z-index: 2; }
/* the scene answers ---------------------------------------------------- */
.cupfire { opacity: 0; transition: opacity 1.3s var(--ease); }
body.answer .cupfire { opacity: 1; transition-delay: var(--d); }
.farwake { opacity: .15; transition: opacity 3s var(--ease) 1.2s; }
body.answer .farwake { opacity: 1; }
.hallwarm { opacity: 0; transition: opacity 3.4s var(--ease) 1s; }
body.answer .hallwarm { opacity: 1; }
.spill { opacity: 0; transition: opacity 2.4s var(--ease) 1.6s; }
body.answer .spill { opacity: 1; }
.passage { opacity: 0; transition: opacity .2s linear .9s; }
body.answer .passage { opacity: 1; }
.stoneslab { transition: transform 1.8s cubic-bezier(.55,.05,.35,1) .9s, opacity .6s linear 2.4s; }
body.answer .stoneslab { transform: translateY(97.9px); opacity: 0; }
.cutm { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .9s var(--ease-in-out), opacity .1s; }
body.c1 .cutm.c1, body.c2 .cutm.c2 { stroke-dashoffset: 0; opacity: 1; }
.cutm.lit { filter: drop-shadow(0 0 2px rgba(var(--violet-rgb), 1)); transition: stroke-dashoffset .9s var(--ease-in-out), opacity .1s, stroke 2s var(--ease) 1s; }
body.answer .cutm.lit { stroke: #ffe3a8; }
.lockflash { opacity: 0; mix-blend-mode: screen; }
body.lock .lockflash { animation: flash 1.4s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: .85; } 100% { opacity: 0; } }
.dust { fill: #dedcf6; opacity: 0; }
body.c1 .dust.c1, body.c2 .dust.c2 { animation: dust 1.1s ease-in var(--dd) forwards; }
@keyframes dust { 0% { opacity: .9; transform: translate(0,0); } 100% { opacity: 0; transform: translate(2px, 22px); } }

/* the words ------------------------------------------------------------ */
.ui { --scrim: 0; }
.head { position: relative; margin-top: 10px; display: grid; }
.head > div { grid-area: 1 / 1; transition: opacity .8s var(--ease), transform .8s var(--ease); }
.head .after { opacity: 0; transform: translateY(8px); transition-delay: 2.6s; }
body.answer .head .before { opacity: 0; transform: translateY(-6px); transition-delay: 1.2s; }
body.answer .head .after { opacity: 1; transform: none; }
.head .say-lg { margin-top: 10px; }
.head .soft { margin-top: 6px; max-width: 30ch; }

.word { text-align: center; }
.word .label-line { margin-bottom: 10px; }
.rod { display: block; width: min(300px, 100%); height: auto; margin: 0 auto; overflow: visible; }
.rodbody { fill: rgba(10, 9, 30, .55); stroke: rgba(206, 204, 255, .45); stroke-width: 1; }
.ghost path { stroke: rgba(206, 204, 255, .16); stroke-dasharray: 2 3; }
.rm { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .9s var(--ease-in-out), opacity .1s; filter: drop-shadow(0 0 3px rgba(var(--violet-rgb), 1)) drop-shadow(0 0 10px rgba(var(--violet-rgb), .7)); }
body.c1 .rm.c1, body.c2 .rm.c2 { stroke-dashoffset: 0; opacity: 1; }
.lockring { opacity: 0; transform: scale(1.08); transform-box: fill-box; transform-origin: center; transition: opacity .6s var(--ease), transform .6s var(--ease);
  filter: drop-shadow(0 0 4px rgba(var(--violet-rgb), 1)) drop-shadow(0 0 14px rgba(var(--violet-rgb), .6)); }
body.lock .lockring { opacity: 1; transform: none; }
.readings { display: grid; grid-template-columns: 1fr 1fr; width: min(300px, 100%); margin: 2px auto 0; padding: 0 17.33%; text-align: center; }
.readings span { font-family: var(--life); font-size: 18px; color: var(--ink); opacity: 0; transition: opacity .6s var(--ease) .5s; }
.readings .q { color: var(--cold-hi); transition: opacity .6s var(--ease); }
body.c1 .readings .r1, body.c2 .readings .r2 { opacity: 1; }
body.lock .readings .q { opacity: 0; }
.hint { margin-top: 8px; min-height: 26px; font-family: var(--life); font-style: italic; font-size: 16.5px; color: var(--ink-2); transition: opacity .4s; }

/* the keys and the way on share one slot */
.slot { display: grid; margin-top: 14px; }
.slot > * { grid-area: 1 / 1; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); transition: opacity .6s var(--ease) .6s; }
.key { position: relative; min-height: var(--btn-h); display: flex; align-items: center; justify-content: center; gap: 12px;
  font-family: var(--life); font-style: italic; font-size: 19px; color: var(--ink-2);
  border: 1px solid var(--edge-3); border-radius: 2px; background: linear-gradient(180deg, rgba(26,24,64,.5), rgba(10,9,28,.66));
  transition: color .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease), opacity .3s var(--ease); }
.key svg { width: 28px; height: 28px; flex: none; }
.key.ready { color: #fff; border-color: rgba(236,234,255,.9);
  background: linear-gradient(180deg, rgba(var(--violet-rgb), .34), rgba(var(--violet-rgb), .12));
  box-shadow: inset 0 0 18px rgba(var(--violet-rgb), .3), 0 0 26px rgba(var(--violet-rgb), .45);
  animation: keyglow 2.4s ease-in-out infinite; }
.key.ready svg { filter: drop-shadow(0 0 5px rgba(var(--violet-rgb), 1)); }
.key.ready::before { content: ""; position: absolute; inset: -6px; pointer-events: none; --tc: rgba(var(--violet-rgb), .75); --tl: 9px;
  background:
    linear-gradient(var(--tc), var(--tc)) left top/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) left top/1px var(--tl) no-repeat,
    linear-gradient(var(--tc), var(--tc)) right top/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) right top/1px var(--tl) no-repeat,
    linear-gradient(var(--tc), var(--tc)) left bottom/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) left bottom/1px var(--tl) no-repeat,
    linear-gradient(var(--tc), var(--tc)) right bottom/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) right bottom/1px var(--tl) no-repeat; }
@keyframes keyglow { 0%,100% { box-shadow: inset 0 0 18px rgba(var(--violet-rgb), .26), 0 0 20px rgba(var(--violet-rgb), .36); } 50% { box-shadow: inset 0 0 22px rgba(var(--violet-rgb), .36), 0 0 34px rgba(var(--violet-rgb), .6); } }
.key.done { opacity: .5; }
.key .q { color: var(--cold-hi); font-style: normal; }
body.answer .keys { opacity: 0; pointer-events: none; }
.go { opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .9s var(--ease) 3.4s, transform .9s var(--ease) 3.4s; }
body.answer .go { opacity: 1; transform: none; pointer-events: auto; }
.after-row { display: flex; justify-content: center; margin-top: 6px; }
.scrim-bottom { --scrim-bottom-h: 50%; }
.scrim-top { --scrim-top-h: 250px; }
@media (max-height: 800px) { .head .soft { font-size: 16px; } .word .label-line { margin-bottom: 6px; } .slot { margin-top: 10px; } }
@media (prefers-reduced-motion: reduce) { .stoneslab { transform: translateY(97.9px); } body:not(.answer) .stoneslab { transform: none; } }

</style>
</head>

<script>
(function(){
  var b = document.body, k1 = document.getElementById('k1'), k2 = document.getElementById('k2'), hint = document.getElementById('hint');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var step = 0, timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, reduce ? 0 : ms)); }
  function cut1(){ if (step !== 0) return; step = 1; b.classList.add('c1'); k1.classList.remove('ready'); k1.classList.add('done'); k2.classList.add('ready'); hint.textContent = 'Now the second.'; }
  function cut2(){ if (step !== 1) return; step = 2; b.classList.add('c2'); k2.classList.remove('ready'); k2.classList.add('done'); hint.textContent = '';
    later(function(){ b.classList.add('lock'); hint.textContent = 'The word locks.'; }, 1000);
    later(function(){ b.classList.add('answer'); hint.textContent = 'The place agreed: wake, stone.'; }, 1500); }
  function auto(){ /* prototype only: if nobody taps, the moment performs itself so it can be seen */
    later(function(){ cut1(); later(cut2, 1200); }, 2000); }
  function reset(){ timers.forEach(clearTimeout); timers = []; step = 0;
    b.classList.remove('c1','c2','lock','answer'); k1.className = 'key ready'; k2.className = 'key'; hint.textContent = 'Tap the first mark to cut it.'; }
  k1.addEventListener('click', function(){ timers.forEach(clearTimeout); timers = []; cut1(); });
  k2.addEventListener('click', function(){ if (step === 0) return; timers.forEach(clearTimeout); timers = []; cut2(); });
  document.getElementById('replay').addEventListener('click', function(){ reset(); requestAnimationFrame(function(){ requestAnimationFrame(auto); }); });
  if (/done/.test(location.hash)) { reduce = true; cut1(); cut2(); } else if (reduce) { cut1(); cut2(); } else auto();
})();
</script>
