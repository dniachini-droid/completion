<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>Cutting a word · The lintel</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

/* the stage: the painting and the marks on the lintel move together (the camera) */
.stage { position: absolute; inset: 0; z-index: 0; transform-origin: var(--ox, 30%) var(--oy, 45%);
  transition: transform 3.2s cubic-bezier(.45, 0, .2, 1); will-change: transform; }
body.answer .stage { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.42); }
.stage .paint { position: absolute; inset: 0; }
.lintel-cuts { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
.cutm { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .9s var(--ease-in-out), opacity .1s; }
body.c1 .cutm.c1, body.c2 .cutm.c2 { stroke-dashoffset: 0; opacity: 1; }
.cutm.lit { filter: drop-shadow(0 0 2px rgba(var(--violet-rgb), 1)) drop-shadow(0 0 6px rgba(var(--violet-rgb), .8)); transition: stroke-dashoffset .9s var(--ease-in-out), opacity .1s, stroke 2s var(--ease) .6s; }
body.answer .cutm.lit { stroke: #ffe3a8; }
.lockflash { opacity: 0; }
body.lock .lockflash { animation: flash 1.4s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: .9; } 100% { opacity: 0; } }

/* the full-screen moment: the interface steps aside; the painting has the whole phone */
/* (filter, not opacity: the entrance animation holds opacity) */
.scrim-top, .scrim-bottom { transition: opacity .5s var(--ease); }
.fade-out { transition: filter .45s var(--ease); }
body.cine .fade-out { filter: opacity(0); pointer-events: none; }
body.cine .scrim-top { opacity: 0; }
body.cine .scrim-bottom { opacity: .35; }
body.settled .fade-out { filter: none; pointer-events: auto; transition-duration: .9s; }
body.settled .scrim-top, body.settled .scrim-bottom { opacity: 1; transition-duration: .9s; }

/* the heading: one before, one after (same place name, carved) */
.head { position: relative; margin-top: 8px; display: grid; }
.head > div { grid-area: 1 / 1; transition: opacity .8s var(--ease), transform .8s var(--ease); }
.head .after { opacity: 0; transform: translateY(8px); }
body.settled .head .before { opacity: 0; }
body.settled .head .after { opacity: 1; transform: none; }
.head .soft { margin-top: 6px; max-width: 30ch; }
.head .say-lg { margin-top: 8px; }

/* the word, in its box, floating over the scene */
.wordbox { text-align: center; padding: 14px 16px 12px; transition: transform 1.2s var(--ease), background .8s var(--ease); }
.wordbox .label-line { margin-bottom: 8px; }
body.cine .wordbox { transform: translateY(-12px); background: linear-gradient(180deg, rgba(20, 18, 52, .34), rgba(8, 7, 24, .44)); }
body.settled .wordbox { transform: none; }
.rod { display: block; width: min(280px, 100%); height: auto; margin: 0 auto; overflow: visible; }
.rodbody { fill: rgba(10, 9, 30, .55); stroke: rgba(206, 204, 255, .45); stroke-width: 1; }
.ghost path { stroke: rgba(206, 204, 255, .16); stroke-dasharray: 2 3; }
.rm { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .9s var(--ease-in-out), opacity .1s; filter: drop-shadow(0 0 3px rgba(var(--violet-rgb), 1)) drop-shadow(0 0 10px rgba(var(--violet-rgb), .7)); }
body.c1 .rm.c1, body.c2 .rm.c2 { stroke-dashoffset: 0; opacity: 1; }
.lockring { opacity: 0; transform: scale(1.08); transform-box: fill-box; transform-origin: center; transition: opacity .6s var(--ease), transform .6s var(--ease);
  filter: drop-shadow(0 0 4px rgba(var(--violet-rgb), 1)) drop-shadow(0 0 14px rgba(var(--violet-rgb), .6)); }
body.lock .lockring { opacity: 1; transform: none; }
.readings { display: grid; grid-template-columns: 1fr 1fr; width: min(280px, 100%); margin: 2px auto 0; padding: 0 17.33%; text-align: center; }
.readings span { font-family: var(--life); font-size: 18px; color: var(--ink); opacity: 0; transition: opacity .6s var(--ease) .5s; }
.readings .q { color: var(--cold-hi); transition: opacity .6s var(--ease); }
body.c1 .readings .r1, body.c2 .readings .r2 { opacity: 1; }
body.lock .readings .q { opacity: 0; }
.hint { margin-top: 6px; min-height: 24px; font-family: var(--life); font-style: italic; font-size: 16.5px; color: var(--ink-2); text-align: center; transition: opacity .4s; }

/* the keys and the way on share one slot */
.slot { display: grid; margin-top: 14px; }
.slot > * { grid-area: 1 / 1; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.key { position: relative; min-height: var(--btn-h); display: flex; align-items: center; justify-content: center; gap: 12px;
  font-family: var(--life); font-style: italic; font-size: 19px; color: var(--ink-2);
  border: 1px solid var(--edge-3); border-radius: 2px; background: linear-gradient(180deg, rgba(26,24,64,.5), rgba(10,9,28,.66));
  transition: color .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease), opacity .3s var(--ease); }
.key svg { width: 28px; height: 28px; flex: none; }
.key.ready { color: #fff; border-color: rgba(236,234,255,.9);
  background: linear-gradient(180deg, rgba(var(--violet-rgb), .34), rgba(var(--violet-rgb), .12));
  box-shadow: inset 0 0 18px rgba(var(--violet-rgb), .3), 0 0 26px rgba(var(--violet-rgb), .45);
  animation: keyglow 2.4s ease-in-out infinite; }
.key.ready svg { filter: drop-shadow(0 0 5px rgba(var(--violet-rgb), 1)); }
@keyframes keyglow { 0%,100% { box-shadow: inset 0 0 18px rgba(var(--violet-rgb), .26), 0 0 20px rgba(var(--violet-rgb), .36); } 50% { box-shadow: inset 0 0 22px rgba(var(--violet-rgb), .36), 0 0 34px rgba(var(--violet-rgb), .6); } }
.key.done { opacity: .5; }
.key .q { color: var(--cold-hi); font-style: normal; }
body.cine .keys { opacity: 0; pointer-events: none; transition: opacity .4s var(--ease); }
body.settled .keys { visibility: hidden; }
.go { opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .9s var(--ease) .5s, transform .9s var(--ease) .5s; }
body.settled .go { opacity: 1; transform: none; pointer-events: auto; }
.after-row { display: flex; justify-content: center; margin-top: 6px; }
.scrim-bottom { --scrim-bottom-h: 52%; }
.scrim-top { --scrim-top-h: 230px; }
@media (max-height: 800px) { .head .soft { font-size: 16px; } .wordbox { padding-top: 10px; padding-bottom: 8px; } .slot { margin-top: 10px; } }

</style>
</head>
<body class="s-day">
<main class="phone">
<div class="stage" id="stage">
  <div class="paint" id="hall" aria-hidden="true"></div>
  <svg class="lintel-cuts" id="cuts" aria-hidden="true"></svg>
</div>
<div class="fog" aria-hidden="true"><i class="drift-a"></i><i class="drift-b"></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="scrim-top" aria-hidden="true"></div>
<div class="scrim-bottom" aria-hidden="true"></div>

<div class="ui">
  <header class="topbar col rise fade-out">
    <a class="home" href="morning.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Today</span></a>
    <span></span>
    <span></span>
  </header>

  <div class="top col head rise d1 fade-out" aria-live="polite">
    <div class="before">
      <h1 class="carve lg">The lintel</h1>
      <p class="soft on-scene">Cut the word: two marks you know, in order.</p>
    </div>
    <div class="after">
      <h1 class="carve lg" aria-hidden="true">The lintel</h1>
      <p class="say-lg on-scene">The lintel answered.</p>
      <p class="soft on-scene">The lamps woke down the hall, and the stone under it has opened.</p>
    </div>
  </div>

  <div class="mid"></div>

  <section class="bottom col word rise d2" aria-label="The word">
    <div class="box ticks wordbox">
      <div class="label-line centred">The word</div>
      <svg class="rod" viewBox="0 0 300 92" aria-hidden="true">
        <rect class="rodbody" x="44" y="8" width="212" height="72" rx="36"/>
        <path d="M150 20 V68" stroke="rgba(206,204,255,.22)"/>
        <g class="ghost"><g transform="translate(78 21) scale(1.150)"><path d="M7 22 Q20 9 33 22 M12 27 Q20 32 28 27 M20 20 L20 20.1" fill="none" stroke-width="1.04" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><g transform="translate(176 21) scale(1.150)"><path d="M10 28 L14 13 L27 10 L31 25 Z M16 21 L25 18" fill="none" stroke-width="1.04" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g></g>
        <g transform="translate(78 21) scale(1.150)"><path class="rm c1" d="M7 22 Q20 9 33 22 M12 27 Q20 32 28 27 M20 20 L20 20.1" pathLength="1" fill="none" stroke="#f4f2ff" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g>
        <g transform="translate(176 21) scale(1.150)"><path class="rm c2" d="M10 28 L14 13 L27 10 L31 25 Z M16 21 L25 18" pathLength="1" fill="none" stroke="#f4f2ff" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g>
        <g class="lockring">
          <rect x="36" y="0" width="228" height="88" rx="44" fill="none" stroke="#e8e6ff" stroke-width="1.2"/>
          <path d="M18 44 H36 M264 44 H282" stroke="#e8e6ff" stroke-width="1.2"/>
        </g>
      </svg>
      <div class="readings" aria-hidden="true"><span class="r1">wake<span class="q">?</span></span><span class="r2">stone<span class="q">?</span></span></div>
      <p class="hint fade-out" id="hint">Tap the first mark to cut it.</p>
    </div>
    <div class="slot">
      <div class="keys">
        <button class="key ready" id="k1"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 22 Q20 9 33 22 M12 27 Q20 32 28 27 M20 20 L20 20.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>wake<span class="q">?</span></span></button>
        <button class="key" id="k2"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 28 L14 13 L27 10 L31 25 Z M16 21 L25 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>stone<span class="q">?</span></span></button>
      </div>
      <a class="btn go" href="stair.html">Go through</a>
    </div>
    <div class="after-row fade-out"><a class="text-link" href="morning.html"><span>Later</span></a></div>
  </section>
</div>
</main>
<script src="hall.js"></script>
<script>
(function(){
  var b = document.body, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var instant = reduce || /done/.test(location.hash);

  /* the hall: you stand across from the lintel; the hall runs on to the right, the cups dark */
  var h = Hall.draw(document.getElementById('hall'), { cam: { x: .1, y: 1.65, z: 2.4, f: .62, cx: .62, cy: .42 }, lintel: 'opening', gold: .15 });

  /* the two marks, cut into the rod-shaped blank on the lintel itself (sample shapes) */
  var WAKE = 'M7 22 Q20 9 33 22 M12 27 Q20 32 28 27 M20 20 L20 20.1', STONE = 'M10 28 L14 13 L27 10 L31 25 Z M16 21 L25 18';
  var cuts = document.getElementById('cuts'), W = h.W, H = h.H;
  cuts.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var p1 = h.mapPath(WAKE, .04, .48), p2 = h.mapPath(STONE, .52, .96);
  var r0 = h.onRod(0, 0), r1 = h.onRod(0, 1), r2 = h.onRod(1, 1), r3 = h.onRod(1, 0);
  cuts.innerHTML =
    '<path class="lockflash" d="M' + r0 + 'L' + r1 + 'L' + r2 + 'L' + r3 + 'Z" fill="rgba(228,226,255,.75)" style="filter:blur(3px)"/>' +
    '<path class="cutm c1" pathLength="1" d="' + p1 + '" fill="none" stroke="#0e0c1e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path class="cutm c1 lit" pathLength="1" d="' + p1 + '" fill="none" stroke="#f0eeff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path class="cutm c2" pathLength="1" d="' + p2 + '" fill="none" stroke="#0e0c1e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path class="cutm c2 lit" pathLength="1" d="' + p2 + '" fill="none" stroke="#f0eeff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>';

  /* the camera: down the hall toward the opening */
  var d = h.door, dx = (d[0][0] + d[3][0]) / 2, dy = (d[1][1] + d[0][1]) / 2, vp = h.project(0, 1.65, 60);
  var ox = dx * .62 + vp[0] * .38, oy = dy * .6 + vp[1] * .4, st = document.getElementById('stage').style;
  st.setProperty('--ox', ox + 'px'); st.setProperty('--oy', oy + 'px');
  st.setProperty('--tx', (W * .42 - ox) * .5 + 'px'); st.setProperty('--ty', (H * .4 - oy) * .5 + 'px');

  var k1 = document.getElementById('k1'), k2 = document.getElementById('k2'), hint = document.getElementById('hint');
  var step = 0, timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, instant ? 0 : ms)); }
  function cut1(){ if (step !== 0) return; step = 1; b.classList.add('c1'); k1.classList.remove('ready'); k1.classList.add('done'); k2.classList.add('ready'); hint.textContent = 'Now the second.'; }
  function cut2(){ if (step !== 1) return; step = 2; b.classList.add('c2'); k2.classList.remove('ready'); k2.classList.add('done'); hint.textContent = '';
    later(function(){ b.classList.add('lock'); }, 1000);
    later(function(){ b.classList.add('cine'); }, 1250);                    /* the interface steps aside */
    later(function(){ b.classList.add('answer'); h.openStone(instant ? 1 : 1900); h.wake(); }, 1650);  /* the stone opens, the cups wake, the camera moves */
    later(function(){ b.classList.add('settled'); }, 4900); }              /* the interface returns: Go through */
  function auto(){ /* prototype only: if nobody taps, the moment performs itself so it can be seen */
    later(function(){ cut1(); later(cut2, 1200); }, 2000); }
  k1.addEventListener('click', function(){ timers.forEach(clearTimeout); timers = []; cut1(); });
  k2.addEventListener('click', function(){ if (step === 0) return; timers.forEach(clearTimeout); timers = []; cut2(); });
  if (instant) { cut1(); cut2(); } else auto();
})();
</script>
</body>
</html>
