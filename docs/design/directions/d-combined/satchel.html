<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<title>The satchel</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

/* screen layers not in direction.css: a tinted fog built per screen (C's technique) */
.sc-fog { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.3) 0%, #000 30%, #000 70%, rgba(0,0,0,.4) 100%);
          mask-image: linear-gradient(180deg, rgba(0,0,0,.3) 0%, #000 30%, #000 70%, rgba(0,0,0,.4) 100%); }
.sc-fog img { position:absolute; top:0; left:0; width:200%; height:100%; will-change:transform; }
.sc-fog .a { animation: drift 60s ease-in-out infinite alternate; opacity:.42; }
.sc-fog .b { animation: drift 95s ease-in-out infinite alternate-reverse; opacity:.3; }
.sc-fog.warm { opacity: var(--warmth);
  -webkit-mask-image: linear-gradient(180deg, transparent 45%, #000 80%);
          mask-image: linear-gradient(180deg, transparent 45%, #000 80%); }


body { --scrim-top-h: 200px; --scrim-bottom-h: 60%; }
.fog { opacity: .55; }
.hall-blur { filter: blur(5px) brightness(.78); transform: scale(1.05); }
.head { margin-top: 10px; }
.head .soft { display:block; margin-top: 8px; }
.inner-glow { animation: satchel-glow 5.5s ease-in-out infinite; }
@keyframes satchel-glow { 0%,100% { opacity:.45; } 50% { opacity:1; } }
.sparks circle { opacity:0; transform-box: fill-box; animation: spark 6s ease-out infinite; }
@keyframes spark { 0% { opacity:0; transform: translate(0,0); } 15% { opacity:.9; } 100% { opacity:0; transform: translate(4px,-46px); } }
.list h2 { font-family: var(--life); font-weight: 500; font-size: 22px; line-height: 1.2; color: #fff; margin: 12px 0 8px; }
.list ul { list-style: none; }
.list .row { width: 100%; text-align: left; grid-template-columns: 20px 1fr 0; min-height: 46px; }
.list li:last-child .row { border-bottom: 0; }
.box-tick { width: 16px; height: 16px; justify-self: center; border: 1px solid var(--edge-2); border-radius: 2px; position: relative;
  background: rgba(8,7,24,.35); transition: all .35s var(--ease); }
.item.done .box-tick { border-color: var(--edge); background: linear-gradient(180deg, rgba(var(--violet-rgb), .5), rgba(var(--violet-rgb), .2));
  box-shadow: 0 0 10px rgba(var(--violet-rgb), .7), inset 0 0 6px rgba(236,234,255,.5); }
.item.done .box-tick::after { content:""; position:absolute; left: 3.5px; top: 3.5px; width: 7px; height: 7px; background: #fff; transform: rotate(45deg) scale(.8);
  box-shadow: 0 0 6px #fff; }
.item.done .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: rgba(var(--violet-rgb), .55); text-decoration-thickness: 1px; }
.list .fold { display:flex; align-items:center; gap: 12px; width: 100%; min-height: 46px; border-top: 1px solid var(--edge-4);
  font-family: var(--life); font-style: italic; font-size: 17px; color: var(--ink-2); text-align: left; }
.list .fold svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--edge); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.list .btn-quiet { margin-top: 10px; }
@media (max-height: 800px) {
  .list h2 { margin: 6px 0 4px; font-size: 21px; }
  .list .row, .list .fold { min-height: 44px; }
}

</style>
</head>

/* the light blooms where you tap (motion only) */
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.btn, .btn-quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
