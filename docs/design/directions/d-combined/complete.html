<style>

/* screen layers not in direction.css: a tinted fog built per screen (C's technique) */
.sc-fog { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.3) 0%, #000 30%, #000 70%, rgba(0,0,0,.4) 100%);
          mask-image: linear-gradient(180deg, rgba(0,0,0,.3) 0%, #000 30%, #000 70%, rgba(0,0,0,.4) 100%); }
.sc-fog img { position:absolute; top:0; left:0; width:200%; height:100%; will-change:transform; }
.sc-fog .a { animation: drift 60s ease-in-out infinite alternate; opacity:.42; }
.sc-fog .b { animation: drift 95s ease-in-out infinite alternate-reverse; opacity:.3; }
.sc-fog.warm { opacity: var(--warmth);
  -webkit-mask-image: linear-gradient(180deg, transparent 45%, #000 80%);
          mask-image: linear-gradient(180deg, transparent 45%, #000 80%); }


.phone:not(.go) * { animation-play-state: paused !important; }
body { --pool-x: 50%; --pool-y: 78%; --scrim-top-h: 240px; --scrim-bottom-h: 30%; }
/* the turn: gold arrives as light from below, in a still-violet place */
.pool { opacity:0; animation: gold 4.2s 0.6s ease-in-out forwards; }
@keyframes gold { to { opacity:1; } }
.sc-fog.warm { opacity:0; animation: gold 4.2s 1.0s ease-in-out forwards; }
.facelight { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0;
  background: radial-gradient(90% 34% at 50% 68%, rgba(255,178,84,.34) 0%, rgba(250,160,60,.14) 55%, rgba(250,160,60,0) 100%), linear-gradient(0deg, rgba(200,110,30,.34) 0%, rgba(240,150,55,.22) 22%, rgba(250,170,70,.08) 40%, rgba(250,170,70,0) 52%);
  mix-blend-mode: screen;
  animation: gold 4.4s 0.8s ease-in-out forwards; }
.glints { position:absolute; inset:0; z-index:2; pointer-events:none; }
.glints i { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff2d4; box-shadow:0 0 8px 2px rgba(255,208,140,.8); opacity:0; animation: glint 2.8s ease-in-out forwards; }
@keyframes glint { 0% { opacity:0; transform:scale(.4); } 40% { opacity:1; transform:scale(1); } 100% { opacity:.55; transform:scale(.8); } }
/* the seam catches the gold last: a thin warm line along its lip */
.seamglow { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; animation: gold 2.4s 3.2s ease-in-out forwards; }
.scrim-top, .scrim-bottom { opacity:0; animation: fadein 1.2s .2s var(--ease) forwards; }
.topbar { opacity:0; animation: rise 1.2s .2s var(--ease) forwards; }
.head { margin-top: 14px; opacity:0; animation: rise 1.4s .4s var(--ease) forwards; }
.head .label-line { margin-bottom: 12px; }
.head .soft { display:block; margin-top:6px; }
.mid { display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding-bottom:10px; }
.enough { font-family:var(--life); font-weight:400; font-size:min(31px, 8vw); line-height:1.15; color:#fff; text-align:center;
  text-shadow: 0 0 26px rgba(242,193,112,.45), 0 2px 18px rgba(8,6,20,.9); opacity:0; animation: rise 1.6s 2.8000000000000003s var(--ease) forwards; }
.enough em { display:inline-block; opacity:0; animation: rise 1.6s 3.7s var(--ease) forwards; }
.cairnrow { display:flex; flex-direction:column; align-items:center; margin-top:10px; }
.cairn { width:60px; height:48px; overflow:visible; }
.cairn .st { opacity:0; transform: translateY(-14px); animation: drop .7s cubic-bezier(.3,1.4,.5,1) forwards; }
.cairn .s1 { animation-delay: 4.6s; } .cairn .s2 { animation-delay: 4.949999999999999s; } .cairn .s3 { animation-delay: 5.3s; }
@keyframes drop { to { opacity:1; transform:none; } }
.cairnrow span { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink); padding:4px 18px; opacity:0;
  animation: fadein 1.2s 5.6s var(--ease) forwards; text-shadow:0 0 12px rgba(8,6,20,.95), 0 0 2px rgba(8,6,20,.9); }
.bottom { opacity:0; animation: rise 1.2s 6.0s var(--ease) forwards; }
.bottom .btn-row { margin-top: 16px; }
.replay svg { width:18px; height:18px; }
@media (max-height: 800px) { .head { margin-top: 8px; } .cairnrow { margin-top: 4px; } .bottom .btn-row { margin-top: 12px; } }

</style>
