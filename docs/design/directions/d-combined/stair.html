<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>The head of the stair</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.scrim-top { --scrim-top-h: 250px; }
.scrim-bottom { --scrim-bottom-h: 30%; }
.push { position: absolute; inset: 0; transform-origin: 50% 40%; animation: push 3.2s cubic-bezier(.2,.7,.1,1) both; }
@keyframes push { from { transform: scale(1.1); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
.head { margin-top: 12px; }
.head .carve { margin-top: 12px; }
.head .say { margin-top: 10px; font-size: 18px; line-height: 1.4; max-width: 28ch; }
.bottom .soft { text-align: center; margin-bottom: 18px; }
.bottom .nav-row { margin-top: 10px; }

</style>
</head>
<body class="s-day">
<main class="phone">
<div class="push" aria-hidden="true"><div class="paint" id="hall"></div></div>
<div class="fog fast" aria-hidden="true"><i class="drift-a"></i><i class="drift-b"></i></div>
<canvas class="motes" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none"></canvas>
<script>
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = document.querySelector('canvas.motes'), x = c.getContext('2d'), W, H, dpr = Math.min(2, window.devicePixelRatio || 1), P = [];
  function size(){ W = c.clientWidth; H = c.clientHeight; c.width = W*dpr; c.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener('resize', size);
  for (var i = 0; i < 40; i++) P.push({ x: Math.random()*W, y: H*(0.2 + Math.random()*(0.75-0.2)), r: .5 + Math.random()*1.3, a: .15 + Math.random()*.45, vx: (Math.random()-.5)*.08, vy: -.02 - Math.random()*.06, p: Math.random()*6.28 });
  var last = 0;
  function tick(t){
    requestAnimationFrame(tick);
    if (t - last < 33) return; last = t;
    x.clearRect(0,0,W,H);
    for (var i = 0; i < P.length; i++) {
      var q = P[i]; q.x += q.vx + Math.sin(t/3000 + q.p)*.05; q.y += q.vy; q.p += .002;
      if (q.y < H*0.2 - 10) { q.y = H*0.75; q.x = Math.random()*W; }
      var al = q.a * (.6 + .4*Math.sin(t/1400 + q.p*3));
      x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.283); x.fillStyle = 'rgba(214,210,255,' + al.toFixed(3) + ')'; x.fill();
    }
  }
  requestAnimationFrame(tick);
})();
</script>

<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="scrim-top" aria-hidden="true"></div>
<div class="scrim-bottom" aria-hidden="true"></div>

<div class="ui">
  <header class="topbar col rise">
    <a class="home" href="morning.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Today</span></a>
    <span></span>
    <a class="icon-link" href="map.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="17" r="2"/><circle cx="12" cy="6.5" r="2"/><circle cx="19" cy="14.5" r="2"/><path d="M6.1 15.2 10.9 8.3M13.5 8 17.6 12.9" stroke-opacity=".75"/></svg><span>Map</span></a>
  </header>
  <div class="top col head rise d2">
    <div class="label-line lit">Beyond the lintel</div>
    <h1 class="carve lg">The head of the stair</h1>
    <p class="say on-scene">A landing, and the top of a long stair going down.</p>
  </div>
  <div class="mid"></div>
  <section class="bottom col rise d4">
    <p class="soft on-scene">The stair will keep. You can go down another day.</p>
    <a class="btn" href="morning.html">Back to today</a>
  </section>
</div>
</main>
<script src="hall.js"></script>
<script>
/* the head of the stair: you stand on the landing beside the stair's open side;
   it goes down step by step into a bank of lit mist. Same hand as the Lamp Hall. */
Hall.draw(document.getElementById('hall'), { scene: 'stair', cam: { x: -1.05, y: 1.7, z: .3, pitch: -28, f: .6, cx: .42, cy: .4 } });
</script>
</body>
</html>
