<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>Set the delve · Order the cat’s medication</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>
/* delve-set: the moment after Begin. Dan chose the dial (D-033; the three tried are in delve-set-variants.html).
   Four stops only: 25, 30, 45, 60, on a 60-minute face: the ring fills in proportion (25 = 5/12, 30 = half, 45 = three quarters,
   60 = full), each stop label at its own angle, 60 at the top where the ring starts and ends. Research: design/research/DELVE_TIMER_CONTROLS.md
   One centre axis: the dial, its number, the stops, the route, the words and the button all share the column's centre. */

body { --scrim-top-h: 300px; --scrim-bottom-h: 52%; }
.dimwash { position:absolute; inset:0; z-index:4; pointer-events:none; background: rgba(5,5,14,.5); }
.hall .hall-far { animation: none; opacity: .5; }

.job { margin-top: 6px; }
.job h1 { margin-top: 8px; }

/* the stage: the dial on the centre line, the route under it */
.stage { position: relative; }
.stage-in { position:absolute; inset: 0 var(--gutter); }

.num { font-family: var(--life); font-weight: 300; line-height: 1; color: #f6f5ff; font-variant-numeric: tabular-nums lining-nums;
  text-shadow: 0 0 24px rgba(var(--violet-rgb), .85), 0 0 64px rgba(var(--violet-rgb), .45); display:inline-block; }
.unit { font-family: var(--life); font-style: italic; font-size: 16px; color: var(--ink-2); }
.num.tick { animation: numtick .42s var(--ease); }
@keyframes numtick { 0% { transform: scale(1); } 30% { transform: scale(1.09); text-shadow: 0 0 20px #fff, 0 0 44px rgba(var(--violet-rgb), 1), 0 0 90px rgba(var(--violet-rgb), .7); } 100% { transform: scale(1); } }

/* the dial: the delve's own ring. --R is its diameter; the stops sit --gap outside it. */
.dialwrap { position:absolute; left:50%; top: calc(50% - 26px); width:0; height:0; }
.dial { --R: min(224px, 56vw, 27vh); position:absolute; left: calc(var(--R) / -2); top: calc(var(--R) / -2); width:var(--R); height:var(--R);
  touch-action:none; cursor:grab; border-radius:50%; }
.dial:active { cursor:grabbing; }
.dial:focus-visible { outline:none; }
.dial:focus-visible .track { background: rgba(210,210,255,.3); }
.dial .band { position:absolute; inset:0; border-radius:50%;
  -webkit-mask: radial-gradient(circle closest-side, transparent 90.5%, #000 91.5%, #000 96.5%, transparent 97.5%);
          mask: radial-gradient(circle closest-side, transparent 90.5%, #000 91.5%, #000 96.5%, transparent 97.5%); }
.dial .track { background: rgba(190,196,255,.14); }
.dial .fill { background: conic-gradient(from 0deg, rgba(var(--violet-rgb),.35) 0, rgba(190,184,255,.95) calc(var(--p) * 1turn - 3deg), #fff calc(var(--p) * 1turn), transparent calc(var(--p) * 1turn + .5deg)); }
.dial .glow { position:absolute; inset:-14%; filter: blur(10px); mix-blend-mode:screen; pointer-events:none; }
.dial .glow .band { inset:12.3%; -webkit-mask: radial-gradient(circle closest-side, transparent 84%, #000 90%, #000 98%, transparent 104%); mask: radial-gradient(circle closest-side, transparent 84%, #000 90%, #000 98%, transparent 104%); }
.dial .glow.wide { filter: blur(24px); opacity:.9; }
.dial .disc { position:absolute; inset:5%; border-radius:50%; pointer-events:none;
  background: radial-gradient(circle, rgba(200,196,255,calc(.05 + var(--p)*.16)), rgba(var(--violet-rgb),calc(.03 + var(--p)*.08)) 60%, transparent 72%); }
.dial .halo { position:absolute; inset:-22%; border-radius:50%; pointer-events:none;
  background: radial-gradient(circle, transparent 42%, rgba(var(--violet-rgb),calc(.06 + var(--p) * .26)) 50%, transparent 66%); }
.dial .notch { position:absolute; left:50%; top:50%; width:2px; height:12px; margin:-6px 0 0 -1px; border-radius:1px; background: var(--edge-2);
  transform: rotate(var(--a)) translateY(calc(var(--R) * -.47)); transition: background .3s var(--ease), box-shadow .3s var(--ease); pointer-events:none; }
.dial .notch.lit { background: #fff; box-shadow: 0 0 8px rgba(var(--violet-rgb), 1); }
.dial .handle { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; pointer-events:none;
  transform: rotate(calc(var(--p) * 1turn)) translateY(calc(var(--R) * -.47)); }
.dial .handle::before { content:""; position:absolute; inset:14px; border-radius:50%;
  background: radial-gradient(circle, #fff 0 32%, rgba(217,214,255,.9) 45%, rgba(var(--violet-rgb),.5) 62%, transparent 72%);
  box-shadow: 0 0 20px 6px rgba(var(--violet-rgb), .7), 0 0 44px 10px rgba(var(--violet-rgb), .3); transition: transform .25s var(--ease); }
.dial.dragging .handle::before { transform: scale(1.35); }
.dial .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.dial .num { font-size: calc(var(--R) * .34); }
.dial .unit { margin-top: 4px; }
.dial .pulse { position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; pointer-events:none; opacity:0;
  transform: rotate(var(--a, 0deg)) translateY(calc(var(--R) * -.47));
  background: radial-gradient(circle, rgba(255,255,255,.9), rgba(var(--violet-rgb),.5) 45%, transparent 70%); }
.dial .pulse.go { animation: pulse .6s var(--ease); }
@keyframes pulse { 0% { opacity:.95; scale: .6; } 100% { opacity:0; scale: 2.8; } }

/* the stops: at their minutes on a 60-minute face (25 at 150°, 30 at 180°, 45 at 270°, 60 at the top), all the same distance out (tap them, too) */
.stop { position:absolute; left:0; top:0; width:48px; height:44px; margin:-22px 0 0 -24px; display:flex; align-items:center; justify-content:center;
  font-family: var(--life); font-size: 17px; color: var(--ink-3); font-variant-numeric: tabular-nums lining-nums;
  transform: rotate(var(--a)) translateY(calc((var(--R) / 2 + 30px) * -1)) rotate(calc(var(--a) * -1));
  transition: color .3s var(--ease), text-shadow .3s var(--ease); }
.stop.on { color: #fff; text-shadow: 0 0 12px rgba(var(--violet-rgb), .95); }
.stop.past { color: var(--ink-2); }
.stop:focus-visible { outline: 1px solid var(--edge); outline-offset: -4px; }
.stops { --R: min(224px, 56vw, 27vh); position:absolute; left:0; top:0; }

/* the route: the column's full width always drawn, markers evenly spaced and dim until reached, all centred on one line */
.route { position:absolute; left:0; right:0; bottom: 0; height: 32px; pointer-events:none; }
.route svg { width:100%; height:100%; overflow:visible; display:block; }

/* where it takes you */
.reach { text-align:center; min-height: 104px; margin-top: 14px; }
.reach h2 { white-space: normal; text-wrap: balance; max-width: 16em; margin-left:auto; margin-right:auto; min-height: 2.5em; line-height: 1.25;
  display:flex; align-items:center; justify-content:center; }
.reach .label-line { justify-content:center; }
.reach h2 { margin-top: 8px; font-size: 22px; letter-spacing: .12em; padding-left: .12em; color: #eceaff;
  text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 0 16px rgba(var(--violet-rgb), .7), 0 0 44px rgba(var(--violet-rgb), .35); }
.reach p { margin-top: 4px; min-height: 24px; }
.reach .swap { transition: opacity .28s var(--ease), transform .28s var(--ease); }
.reach .swap.out { opacity: 0; transform: translateY(4px); }
.reach.new h2 { color: #d8d4ff; text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 0 22px rgba(var(--violet-rgb), .95), 0 0 60px rgba(var(--violet-rgb), .5); }

.go { margin-top: 10px; }
.go .soft { text-align:center; font-size: 16px; margin-bottom: 14px; }
.go .soft b { font-weight: 500; font-style: normal; color: var(--ink); }

@media (max-height: 800px) {
  .job h1 { font-size: 24px; }
  .reach { min-height: 96px; margin-top: 10px; }
  .reach h2 { font-size: 19px; }
  .go .soft { margin-bottom: 10px; }
}
</style>
</head>
<body class="s-day">
<main class="phone">

<div class="paint" id="hall"></div>
<div class="fog" aria-hidden="true"><i class="drift-a"></i><i class="drift-b"></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="dimwash" aria-hidden="true"></div>
<div class="scrim-top" aria-hidden="true"></div>
<div class="scrim-bottom" aria-hidden="true"></div>

<div class="ui">
  <header class="top col">
    <div class="topbar rise">
      <a class="home" href="morning.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Today</span></a>
      <span></span><span></span>
    </div>
    <section class="job rise d1">
      <div class="label-line lit">A delve</div>
      <h1 class="say-lg">Order the cat’s medication</h1>
    </section>
  </header>

  <div class="mid stage col rise d2" id="stage">
    <div class="stage-in">
      <div class="dialwrap">
        <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Length of the delve" aria-valuemin="25" aria-valuemax="60" aria-valuenow="25" style="--p:.4167">
          <div class="halo"></div><div class="disc"></div>
          <div class="band track"></div>
          <div class="glow wide"><div class="band fill"></div></div>
          <div class="glow"><div class="band fill"></div></div>
          <div class="band fill"></div>
          <i class="notch" data-m="25" style="--a:150deg"></i><i class="notch" data-m="30" style="--a:180deg"></i><i class="notch" data-m="45" style="--a:270deg"></i><i class="notch" data-m="60" style="--a:360deg"></i>
          <div class="pulse"></div>
          <div class="handle"></div>
          <div class="inner"><span class="num">25</span><span class="unit">minutes</span></div>
        </div>
        <div class="stops">
          <button class="stop" type="button" data-m="60" style="--a:0deg" aria-label="60 minutes">60</button>
          <button class="stop" type="button" data-m="25" style="--a:150deg" aria-label="25 minutes">25</button>
          <button class="stop" type="button" data-m="30" style="--a:180deg" aria-label="30 minutes">30</button>
          <button class="stop" type="button" data-m="45" style="--a:270deg" aria-label="45 minutes">45</button>
        </div>
      </div>
      <div class="route"><svg id="route" aria-hidden="true"></svg></div>
    </div>
  </div>

  <section class="bottom col">
    <div class="reach rise d3" id="reach" aria-live="polite">
      <div class="label-line centred">How far</div>
      <h2 class="carve swap" id="rp">Towards the Salt Gallery</h2>
    </div>
    <div class="go rise d4">
      <p class="soft on-scene">Then a breather: <b>5 minutes</b>.</p>
      <a class="btn" id="start" href="delve.html#cat-25">Start the delve</a>
    </div>
  </section>
</div>
</main>

<script src="lamp.js"></script>
<script src="hall.js"></script>
<script>
/* the light blooms where you tap (motion only) */
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.btn, .btn-quiet').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); el.style.overflow = ''; }, 950);
    });
  });
})();
</script>
<script>
(function(){
  'use strict';
  var STOPS = [25, 30, 45, 60];
  var ANG = { 25: 150, 30: 180, 45: 270, 60: 360 };   /* a 60-minute face: 6° a minute, from the top */
  /* only the open first region: never past the sealed lintel */
  var REACH = {
    25: 'Towards the Salt Gallery',
    30: 'The Salt Gallery, and a little past it',
    45: 'On to the Survey Cut',
    60: 'The far end of the Survey Cut'
  };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';
  var state = { v: 25, snap: 25 };

  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function nearest(v) { var b = STOPS[0]; STOPS.forEach(function (s) { if (Math.abs(s - v) < Math.abs(b - v)) b = s; }); return b; }
  function magnet(v) { var d = nearest(v), k = Math.abs(v - d); return k < 2.5 ? v + (d - v) * (1 - k / 2.5) * .6 : v; }
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function retrigger(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  /* minutes ↔ angle: 6° a minute (and a piecewise map for the route) */
  function lerpMap(x, xs, ys) { for (var i = 0; i < xs.length - 1; i++) if (x <= xs[i + 1]) return ys[i] + (ys[i + 1] - ys[i]) * (x - xs[i]) / (xs[i + 1] - xs[i]); return ys[ys.length - 1]; }
  function angOf(v) { return v * 6; }
  function minOf(a) { return a / 6; }

  /* the painted hall behind */
  try { Hall.draw(document.getElementById('hall'), { cam: { y: 1.7, pitch: -3, f: .9, cy: .4 }, cups: 'dark', lintel: 'sealed', gold: .1, res: .75 }); } catch (e) {}

  var dial = document.getElementById('dial');
  var stopEls = Array.prototype.slice.call(document.querySelectorAll('.stop'));
  stopEls.forEach(function (b) { b.addEventListener('click', function () { settle(+b.dataset.m, true); }); });

  /* the route: you → the Salt Gallery → the Survey Cut → its far end. Arches only (never the stair: it lies past the sealed lintel).
     The whole bar always shows, so it reads centred; each place is dim until the lit line reaches it. */
  var route = document.getElementById('route'), R = null;
  function drawRoute() {
    route.innerHTML = '';
    var W = route.clientWidth, H = route.clientHeight, y = Math.round(H / 2) + .5, pad = 9;
    route.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var xs = [0, 1, 2, 3].map(function (i) { return Math.round(pad + i * (W - 2 * pad) / 3) + .5; });
    var d = el('defs', {}, route);
    d.innerHTML = '<linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" x2="' + W + '" y1="0" y2="0"><stop offset="0" stop-color="#8f86ff" stop-opacity=".25"/><stop offset="1" stop-color="#ece9ff"/></linearGradient>' +
      '<radialGradient id="rn"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#b9b3ff" stop-opacity=".7"/><stop offset="1" stop-color="#8f86ff" stop-opacity="0"/></radialGradient>';
    el('path', { d: 'M' + xs[0] + ' ' + y + ' H' + xs[3], stroke: 'rgba(186,186,255,.3)', 'stroke-width': 1 }, route);
    var lit = el('path', { stroke: 'url(#rg)', 'stroke-width': 1.6, 'stroke-linecap': 'round', style: 'filter:drop-shadow(0 0 4px rgba(143,134,255,.9))' }, route);
    /* each glyph is drawn in a 16×16 box centred on (0,0), so all share one centre line; a dark fill hides the track behind it */
    var ARCH = 'M-6 8 V-1 Q-6 -8 0 -8 Q6 -8 6 -1 V8';
    function glyph(x) { var g = el('g', { transform: 'translate(' + x + ' ' + y + ')' }, route); el('path', { d: ARCH + ' Z', fill: '#0b0b1c', stroke: 'none' }, g); el('path', { d: ARCH, fill: 'none', stroke: '#e9e6ff', 'stroke-width': 1.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g); return g; }
    el('circle', { cx: xs[0], cy: y, r: 3.2, fill: '#ffd27a', style: 'filter:drop-shadow(0 0 5px #f2c170)' }, route);
    var gs = [glyph(xs[1]), glyph(xs[2]), glyph(xs[3])];
    var spark = el('circle', { cy: y, r: 10, fill: 'url(#rn)' }, route);
    R = { xs: xs, y: y, lit: lit, gs: gs, spark: spark };
  }
  function renderRoute(v) {
    if (!R) return;
    var xs = R.xs;
    /* 25: most of the way to the Gallery; 30: a little past it; 45: the Survey Cut; 60: its far end */
    var x = lerpMap(clamp(v, 25, 60), [25, 30, 45, 60], [xs[0] + (xs[1] - xs[0]) * .8, xs[1] + (xs[2] - xs[1]) * .3, xs[2], xs[3]]);
    if (v < 25) x = xs[0] + (xs[1] - xs[0]) * .8 * v / 25;
    R.lit.setAttribute('d', 'M' + xs[0] + ' ' + R.y + ' H' + x.toFixed(1));
    R.spark.setAttribute('cx', x.toFixed(1));
    R.gs.forEach(function (g, i) {
      var gx = xs[i + 1], k = clamp(1 - (gx - x) / 14, 0, 1);   /* lights as the line arrives */
      g.setAttribute('opacity', (.34 + .66 * k).toFixed(2));
      g.style.filter = k > .5 ? 'drop-shadow(0 0 4px rgba(143,134,255,.9))' : '';
    });
  }

  var nums = document.querySelectorAll('.num');
  var reach = document.getElementById('reach'), rp = document.getElementById('rp'), start = document.getElementById('start');
  var shownSnap = 25, swapT = null;
  function render() {
    var v = state.v, s = nearest(v);
    dial.style.setProperty('--p', (angOf(v) / 360).toFixed(4));
    dial.querySelectorAll('.notch').forEach(function (n) { n.classList.toggle('lit', +n.dataset.m <= v + .01); });
    renderRoute(v);
    if (s !== shownSnap) { tick(s); shownSnap = s; }
    stopEls.forEach(function (b) { var m = +b.dataset.m; b.classList.toggle('on', m === s); b.classList.toggle('past', m < s); });
  }
  /* the delve starts on the job the dial was opened from, at this length */
  function setWords(s) { rp.textContent = REACH[s]; reach.classList.toggle('new', s === 60); start.href = 'delve.html#cat-' + s; }
  function tick(s) {
    nums.forEach(function (n) { n.textContent = s; retrigger(n, 'tick'); });
    var pulse = dial.querySelector('.pulse'); pulse.style.setProperty('--a', ANG[s] + 'deg'); retrigger(pulse, 'go');
    buzz(8);
    dial.setAttribute('aria-valuenow', s); dial.setAttribute('aria-valuetext', s + ' minutes, ' + REACH[s]);
    clearTimeout(swapT);
    rp.classList.add('out');
    swapT = setTimeout(function () { setWords(s); rp.classList.remove('out'); }, reduce ? 0 : 180);
  }

  /* settle: ease to a stop, with a small overshoot, like a detent */
  var anim = null;
  function settle(target, fromTap) {
    cancelAnimationFrame(anim);
    state.snap = target;
    if (reduce) { state.v = target; render(); return; }
    var from = state.v, t0 = null, dur = fromTap ? 520 : 380;
    function back(k) { var c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
    function f(ts) {
      if (t0 == null) t0 = ts;
      var k = clamp((ts - t0) / dur, 0, 1);
      state.v = clamp(from + (target - from) * back(k), 24, 61);
      render();
      if (k < 1) anim = requestAnimationFrame(f); else { state.v = target; render(); }
    }
    anim = requestAnimationFrame(f);
  }

  /* drag round the ring. The empty arc from the top to 25 (0°–150°) is a stop, so it never jumps across the top. */
  function angleAt(e) {
    var r = dial.getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
    var a = Math.atan2(dx, -dy) * 180 / Math.PI; if (a < 0) a += 360;
    return { a: a, d: Math.hypot(dx, dy), w: r.width };
  }
  dial.addEventListener('pointerdown', function (e) {
    var p0 = angleAt(e);
    if (p0.d < p0.w * .28) return;   /* the ring and a wide margin, not the number */
    cancelAnimationFrame(anim);
    dial.setPointerCapture(e.pointerId); dial.classList.add('dragging');
    function mv(ev) {
      var a = angleAt(ev).a, lastA = angOf(state.v);
      if (a < 150) a = lastA > 255 ? 360 : 150;    /* in the empty arc: hold at whichever end you came from */
      if (Math.abs(a - lastA) > 120) a = lastA;
      state.v = magnet(clamp(minOf(a), 25, 60)); render();
    }
    function up() { dial.classList.remove('dragging'); dial.removeEventListener('pointermove', mv); dial.removeEventListener('pointerup', up); dial.removeEventListener('pointercancel', up); settle(nearest(state.v)); }
    dial.addEventListener('pointermove', mv); dial.addEventListener('pointerup', up); dial.addEventListener('pointercancel', up);
    mv(e); e.preventDefault();
  });
  dial.addEventListener('keydown', function (e) {
    var i = STOPS.indexOf(state.snap), k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowUp' || k === '+' || k === '=') i++;
    else if (k === 'ArrowLeft' || k === 'ArrowDown' || k === '-') i--;
    else if (k === 'Home') i = 0; else if (k === 'End') i = 3; else return;
    e.preventDefault(); settle(STOPS[clamp(i, 0, 3)], true);
  });

  /* #45 or #a-45 opens at that length (for pictures) */
  var m = /(\d+)/.exec(location.hash || ''), n = m ? +m[1] : 25;
  if (STOPS.indexOf(n) < 0) n = 25;
  state.v = n; state.snap = n; shownSnap = n;
  nums.forEach(function (x) { x.textContent = n; }); setWords(n);
  dial.setAttribute('aria-valuenow', n); dial.setAttribute('aria-valuetext', n + ' minutes, ' + REACH[n]);
  function layout() { drawRoute(); render(); }
  layout(); addEventListener('resize', layout);
})();
</script>
</body>
</html>
