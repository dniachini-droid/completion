<title>The map · The Quiet</title>

<style>

.paint > img { object-fit: cover; }
.live { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; display: block; }
.places { z-index: 2; mix-blend-mode: screen; }
body { --scrim-top-h: 210px; --scrim-bottom-h: 26%; }
.places .pl { transform-box: fill-box; transform-origin: center; animation: pl-in 1.4s var(--ease) both; }
@keyframes pl-in { from { opacity: 0; } to { opacity: 1; } }
.hum { animation: hum 7s ease-in-out infinite; }
@keyframes hum { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
.nn { font-family: var(--carve); font-size: 16px; font-weight: 600; letter-spacing: .08em; fill: #e9e7ff; filter: url(#halo2); }
.nn.here { fill: #fff; }
.ns { font-family: var(--life); font-style: italic; font-size: 16.5px; fill: #c3c3e8; filter: url(#halo2); }
.ns.warm { fill: #f1c98e; }
.ns.dim { fill: #9d9dcc; }
.labels { animation: fadein 1.2s var(--ease) .9s both; }
.fadein { animation: fadein 1.2s var(--ease) both; }
.reticle { transition: transform .55s var(--ease); animation: fadein .8s var(--ease) 1.5s both; }
.spin { animation: spin 50s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.node { cursor: pointer; outline: none; }
.head { margin-top: 6px; }
.head h1 { margin-top: 8px; }
.bottom .box { min-height: 132px; display: flex; flex-direction: column; }
.box .title { margin-top: 10px; }
.box p { margin-top: 6px; font-size: 17px; line-height: 1.42; color: var(--ink-2); }
.box .act { margin-top: 14px; }
.box .act[hidden] { display: none; }
.box .swap { animation: rise .45s var(--ease) both; }
@media (max-height: 800px) { .bottom .box { min-height: 124px; padding: 14px 16px; } }

</style>
</head>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.btn, .btn-quiet, .seg > button, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); el.style.overflow = ''; }, 950);
    });
  });
})();
</script>
<script>
(function(){
  var N = {"mouth":[174,222],"survey":[326,288],"hall":[212,356],"salt":[84,434],"lintel":[312,440],"door":[150,520],"stair":[360,546]};
  var C = {
    hall:   ['You are here', 'The Lamp Hall', 'The clay lamp is lit on its ledge. Camp is here tonight.', null],
    mouth:  ['Reached', 'The Mouth', 'The capped shaft and the ladder. The way you came in.', null],
    survey: ['Reached', 'The Survey Cut', 'A side cut off the hall. You’ve walked it and left a cairn.', null],
    salt:   ['Seen', 'The Salt Gallery', 'Seen, not reached yet. Today’s course takes the expedition there.', null],
    lintel: ['Sealed · needs a word', 'The lintel', 'Two marks beside a rod-shaped blank. You know two that might fit.', ['Try a word', 'cut.html']],
    door:   ['Sealed · a count and a word', 'The great door', 'At the far end. A count that hasn’t filled, and a blank for a word.', null],
    stair:  ['Not reached', 'The head of the stair', 'Beyond the lintel. Only its shape, so far.', null]
  };
  if (/stair|open/.test(location.hash)) {
    C.lintel = ['Opened', 'The lintel', 'The word held, and the stone under it opened.', null];
    C.stair = ['Open now', 'The head of the stair', 'Through the lintel: a landing, and a long stair going down.', ['Go down', 'stair.html']];
    document.getElementById('lintelsub').textContent = 'opened';
    document.getElementById('stairlabel').textContent = 'the stair · open';
    document.getElementById('stairshape').setAttribute('opacity', '1');
    document.getElementById('stairpool').setAttribute('opacity', '.9');
    document.querySelectorAll('.lines [stroke-dasharray]').forEach(function(l){ l.setAttribute('stroke-opacity', '.5'); l.removeAttribute('stroke-dasharray'); });
  }
  var ret = document.getElementById('reticle'), sw = document.getElementById('sw');
  function show(k){
    var p = N[k], c = C[k];
    ret.style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
    document.getElementById('cl').textContent = c[0];
    document.getElementById('ct').textContent = c[1];
    document.getElementById('cp').textContent = c[2];
    var b = document.getElementById('cb');
    if (c[3]) { b.hidden = false; b.textContent = c[3][0]; b.href = c[3][1]; } else { b.hidden = true; }
    sw.style.animation = 'none'; sw.offsetWidth; sw.style.animation = '';
  }
  document.querySelectorAll('.node').forEach(function(n){
    n.addEventListener('click', function(){ show(n.dataset.n); });
    n.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(n.dataset.n); } });
  });
  var m = location.hash.match(/sel=(\w+)/); if (m && C[m[1]]) show(m[1]);
  else if (/stair|open/.test(location.hash)) show('stair');
})();
</script>
