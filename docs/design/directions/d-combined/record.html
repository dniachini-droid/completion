<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>A record · The long tally</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.scrim-top { --scrim-top-h: 200px; }
.scrim-bottom { --scrim-bottom-h: 62%; }
.head .carve { margin-top: 10px; }
.head .soft { margin-top: 6px; }

/* the reading band: a strip of the face cut smooth and polished, so the line of marks sits in a
   deliberate channel, with the tally scratches running on above and below it (Dan's note) */
.phone { --band-top: 226px; --band-h: 130px; }
/* the strip never moves (Dan, second look): it is pinned to the screen at a fixed height from the top,
   and the header above it sits in a fixed-height block, so nothing below can push it */
.upper { flex: none; height: calc(var(--band-top) + var(--band-h) - var(--safe-t)); }
.band { position: absolute; left: 0; right: 0; top: var(--band-top); height: var(--band-h); margin: 0; padding: 22px 0 16px; }
.band::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(60% 90% at 50% 45%, rgba(206, 202, 255, .16), rgba(206, 202, 255, 0) 70%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='390' height='120' preserveAspectRatio='none'><filter id='p' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.006 .05' numOctaves='2' seed='6'/><feColorMatrix values='0 0 0 0 .78  0 0 0 0 .76  0 0 0 0 1  0 0 0 .22 -.04'/></filter><rect width='390' height='120' filter='url(%23p)'/></svg>") center/100% 100% no-repeat,
    linear-gradient(180deg, #1f1c44 0%, #2c2960 38%, #312e68 62%, #26234f 100%);
  /* cut into the face, not laid on it: the channel's ends fade out at the screen edges (short fade, so no mark sits on the scratches) */
  -webkit-mask-image: linear-gradient(90deg, transparent 2px, #000 20px, #000 calc(100% - 20px), transparent calc(100% - 2px));
          mask-image: linear-gradient(90deg, transparent 2px, #000 20px, #000 calc(100% - 20px), transparent calc(100% - 2px));
  box-shadow:
    inset 0 9px 12px -6px rgba(3, 2, 10, .8),        /* the upper lip shades the channel */
    inset 0 -1px 0 rgba(222, 218, 255, .32),         /* the lower lip catches the light */
    0 -1px 0 rgba(222, 218, 255, .14),
    0 1px 0 rgba(222, 218, 255, .22),
    0 12px 22px -10px rgba(3, 2, 10, .7); }
.band::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 60%; transform: translateY(-50%); pointer-events: none;
  background: radial-gradient(50% 50% at 50% 50%, rgba(var(--violet-rgb), .16), rgba(var(--violet-rgb), 0)); }
.band .col { position: relative; z-index: 1; }

/* the line of marks: six even columns; every glyph in the same square on one line, every label on one line beneath */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: start; margin: 0 calc(var(--gutter) * -.5); }
.cell { position: relative; display: grid; grid-template-rows: 52px 24px; justify-items: center; align-items: center; row-gap: 8px; padding: 6px 0 2px; color: #eceaff; }
.cell .gw { position: relative; display: block; width: 52px; height: 52px; }
.glyph { display: block; width: 100%; height: 100%; overflow: visible;
  filter: drop-shadow(0 0 5px rgba(var(--cold-rgb), .75)) drop-shadow(0 0 14px rgba(var(--cold-rgb), .3)); transition: filter .35s var(--ease), color .35s var(--ease); }
.cap { font-family: var(--life); font-style: italic; font-size: 16px; line-height: 24px; height: 24px; color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 8px rgba(6,5,16,.9); }
.cap .q { color: var(--cold-hi); }
.cap.unk { color: var(--ink-3); }
.cell.sel .cap { color: #fff; }
/* selected: B's corner ticks close round the mark, and it brightens */
.cell::before { content: ""; position: absolute; left: 50%; width: 60px; margin-left: -30px; top: 2px; height: 60px; pointer-events: none; opacity: 0;
  --tc: var(--violet-hi); --tl: 8px; transform: scale(1.12); transition: opacity .3s var(--ease), transform .35s var(--ease);
  background:
    linear-gradient(var(--tc), var(--tc)) left top/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) left top/1px var(--tl) no-repeat,
    linear-gradient(var(--tc), var(--tc)) right top/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) right top/1px var(--tl) no-repeat,
    linear-gradient(var(--tc), var(--tc)) left bottom/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) left bottom/1px var(--tl) no-repeat,
    linear-gradient(var(--tc), var(--tc)) right bottom/var(--tl) 1px no-repeat, linear-gradient(var(--tc), var(--tc)) right bottom/1px var(--tl) no-repeat;
  filter: drop-shadow(0 0 4px rgba(var(--violet-rgb), .9)); }
.cell.sel::before { opacity: 1; transform: none; }
.cell.sel { color: #fff; }
.cell.sel .glyph { filter: drop-shadow(0 0 6px rgba(var(--violet-rgb), 1)) drop-shadow(0 0 20px rgba(var(--violet-rgb), .8)); }
.cell.sel .gw::after { content: ""; position: absolute; inset: -30%; border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--violet-rgb), .45), transparent); animation: breathe 3s ease-in-out infinite; }
.cell:not(.sel):hover .glyph { filter: drop-shadow(0 0 6px rgba(var(--cold-rgb), .9)) drop-shadow(0 0 16px rgba(var(--cold-rgb), .45)); }
/* the leader from the chosen mark down to what you know of it */
.lead { position: relative; height: 26px; margin-top: 2px; }
.lead i { position: absolute; top: 0; width: 1px; height: 100%; background: linear-gradient(180deg, var(--violet-hi), rgba(var(--violet-rgb), 0));
  transition: left .35s var(--ease); }
.lead i::before { content: ""; position: absolute; left: -2px; top: -1px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet-hi); box-shadow: 0 0 8px var(--violet); }

.said { text-align: center; font-size: 19px; }
.divider { width: 64%; margin: 18px auto 0; }

/* what you know of the chosen mark: out in the open */
.readout { margin: 30px 0 28px; }
.readout .label-line { margin-bottom: 10px; }
.readout .know { font-family: var(--life); font-size: 18px; line-height: 1.4; color: var(--ink); height: calc(18px * 1.4 * 3); overflow: hidden; }
.readout .know em { font-style: italic; color: var(--violet-hi); }
.choices { margin-top: 14px; grid-auto-flow: row; grid-template-columns: 1fr 1fr; grid-template-rows: 54px 54px; align-content: start; gap: 12px var(--gap); }
/* the answer area is one fixed size, sized for its longest state (three lines, two rows of guesses) */
.readout { flex: none; }
.choices { height: calc(54px * 2 + 12px); }
/* the guesses are the screen's action: lit boxes, the chosen one full of light */
.choices > button { min-height: 54px; font-family: var(--life); font-style: italic; font-weight: 400; font-size: 18px; letter-spacing: 0; text-transform: none; color: var(--ink);
  border-color: var(--edge-2); padding: 0 8px; background: linear-gradient(180deg, rgba(var(--violet-rgb), .16), rgba(var(--violet-rgb), .05));
  box-shadow: inset 0 0 18px rgba(var(--violet-rgb), .14), 0 0 20px rgba(var(--violet-rgb), .14); }
.choices > button:last-child { color: var(--ink-2); }
.choices > button[aria-pressed="true"] { font-weight: 600; color: var(--btn-ink); border-color: rgba(236, 234, 255, .92); text-shadow: none;
  background: radial-gradient(70% 140% at 50% 125%, rgba(235, 232, 255, .7), rgba(var(--violet-rgb), 0) 70%), linear-gradient(180deg, #a9a2ff 0%, var(--violet) 55%, #7466f0 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 26px rgba(var(--violet-rgb), .5); }
.bottom { display: flex; justify-content: center; }
.bottom .text-link { min-height: 48px; }
.choices:empty { visibility: hidden; }
.readout .fade-in { animation: fadein .45s var(--ease) both; }
@media (max-height: 800px) { .phone { --band-top: 206px; --band-h: 122px; } .band { padding: 18px 0 12px; } .readout { margin-top: 24px; margin-bottom: 22px; } .divider { margin-top: 12px; } }

</style>
</head>
