.phone:not(.go) * { animation-play-state: paused !important; }
body { --pool-x: 50%; --pool-y: 78%; }
/* the turn: gold arrives as light from below, in a still-violet place */
.pool { opacity:0; animation: gold 4.2s 0.6s ease-in-out forwards; }
@keyframes gold { to { opacity:1; } }
.fog.warm { opacity:0; animation: gold 4.2s 1.0s ease-in-out forwards; }
.facelight { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; mix-blend-mode:screen;
  background: linear-gradient(0deg, rgba(242,176,96,.42) 0%, rgba(242,176,96,.2) 24%, rgba(242,176,96,0) 48%);
  animation: gold 4.4s 0.8s ease-in-out forwards; }
.glints { position:absolute; inset:0; z-index:2; pointer-events:none; }
.glints i { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff2d4; box-shadow:0 0 8px 2px rgba(255,208,140,.8); opacity:0; animation: glint 2.8s ease-in-out forwards; }
@keyframes glint { 0% { opacity:0; transform:scale(.4); } 40% { opacity:1; transform:scale(1); } 100% { opacity:.55; transform:scale(.8); } }
.bar .replay { position:absolute; left:50%; transform:translateX(-50%); }
.top { opacity:0; animation: rise 1.4s .3s var(--ease) forwards; }
.top .soft { display:block; margin-top:4px; }
.mid { display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding-bottom:6px; }
.enough { font-family:var(--life); font-weight:400; font-size:min(34px, 8.4vw); padding:0 16px; line-height:1.15; color:#fff; text-align:center; text-shadow: 0 0 26px rgba(242,193,112,.45), 0 2px 18px rgba(8,6,20,.9); opacity:0; animation: rise 1.6s 2.8000000000000003s var(--ease) forwards; }
.enough em { display:inline-block; opacity:0; animation: rise 1.6s 3.7s var(--ease) forwards; }
.cairnrow { display:flex; flex-direction:column; align-items:center; margin-top:10px; }
.cairn { width:60px; height:48px; overflow:visible; }
.cairn .st { opacity:0; transform: translateY(-14px); animation: drop .7s cubic-bezier(.3,1.4,.5,1) forwards; }
.cairn .s1 { animation-delay: 4.6s; } .cairn .s2 { animation-delay: 4.949999999999999s; } .cairn .s3 { animation-delay: 5.3s; }
@keyframes drop { to { opacity:1; transform:none; } }
.cairnrow span { font-family:var(--life); font-style:italic; font-size:16px; color:#f0dcc0; opacity:0; animation: fadein 1.2s 5.6s var(--ease) forwards; text-shadow:0 0 12px rgba(8,6,20,.9); }
.bank { opacity:0; animation: rise 1.2s 6.0s var(--ease) forwards; }
.bank .row2 { display:flex; justify-content:center; }

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
(function(){
  function arm(ph){
    function go(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ ph.classList.add('go'); }); }); }
    if (document.readyState === 'complete') go(); else addEventListener('load', go);
    ph.querySelector('#replay').addEventListener('click', function(){ var c = ph.cloneNode(true); c.classList.remove('go'); ph.parentNode.replaceChild(c, ph); arm(c); });
  }
  arm(document.querySelector('.phone'));
  var m = location.hash.match(/t=([\d.]+)/);
  if (m) addEventListener('load', function(){ setTimeout(function(){ document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = parseFloat(m[1]) * 1000; }); }, 50); });
})();
</script>
