<style>

.phone:not(.go) * { animation-play-state: paused !important; }
/* the turn: cold becomes gold across the whole screen */
.tint { position:absolute; inset:0; z-index:1; pointer-events:none; }
.tint.cold { background: linear-gradient(180deg, #2c3380, #5563c0 50%, #1c2160); mix-blend-mode: color; opacity:.92; animation: coldhalf 3.6s 0.6s ease-in-out forwards; }
.tint.cold-dim { background: rgba(10,12,40,.55); mix-blend-mode: multiply; animation: out 3.6s 0.6s ease-in-out forwards; }
.tint.gold { inset:-70% 0 0 0; background: linear-gradient(180deg, transparent 0%, rgba(214,150,80,.55) 22%, #e3a455 40%, #d8964a 100%); mix-blend-mode: color; opacity:.9; transform: translateY(100%); animation: goldrise 4.4s 0.6s cubic-bezier(.45,.05,.3,1) forwards; }
@keyframes goldrise { to { transform: translateY(30%); } }
@keyframes coldhalf { to { opacity:.55; } }
.tint.bloom { background:
    radial-gradient(70% 45% at 50% 70%, rgba(255,210,140,.55), transparent 70%),
    radial-gradient(40% 55% at 55% 35%, rgba(255,230,180,.28), transparent 70%);
  mix-blend-mode: screen; opacity:0; animation: in 4.2s 1.2s ease-in-out forwards; }
@keyframes out { to { opacity:0; } }
@keyframes in { to { opacity:1; } }
.paint { animation: settle 7s ease-out both; }
@keyframes settle { from { transform: scale(1.06); } to { transform: scale(1); } }

.glints { position:absolute; inset:0; z-index:2; pointer-events:none; }
.glints i { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff4d8; box-shadow:0 0 8px 2px rgba(255,210,140,.8); opacity:0; animation: glint 2.8s ease-in-out forwards; }
@keyframes glint { 0% { opacity:0; transform:scale(.4); } 40% { opacity:1; transform:scale(1); } 100% { opacity:.55; transform:scale(.8); } }

.head { position:absolute; top:100px; left:var(--gutter); right:var(--gutter); z-index:6; opacity:0; animation: rise 1.4s .3s var(--ease) forwards; }
.head .pl { font-size:36px; color:#fff6e6; text-shadow: 0 0 22px rgba(10,8,20,.9), 0 0 40px rgba(244,200,119,.35); }
.head .sub { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-warm-2); margin-top:4px; text-shadow:0 0 14px rgba(10,8,20,.9); }

.enough { position:absolute; left:0; right:0; top:566px; z-index:6; text-align:center; }
.enough p { font-family:var(--life); font-weight:400; font-size:34px; line-height:1.15; color:#fff8ec; text-shadow: 0 0 30px rgba(244,200,119,.6), 0 2px 18px rgba(30,15,5,.8); opacity:0; }
.enough .a { animation: rise 1.6s 2.8000000000000003s var(--ease) forwards; }
.enough .b { display:inline-block; opacity:0; animation: rise 1.6s 3.7s var(--ease) forwards; font-style:italic; }

.cairnrow { position:absolute; left:0; right:0; top:618px; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.cairn { width:56px; height:45px; overflow:visible; }
.cairn .st { opacity:0; transform: translateY(-14px); animation: drop .7s cubic-bezier(.3,1.4,.5,1) forwards; }
.cairn .s1 { animation-delay: 4.6s; } .cairn .s2 { animation-delay: 4.949999999999999s; } .cairn .s3 { animation-delay: 5.3s; }
@keyframes drop { to { opacity:1; transform:none; } }
.cairnrow span { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-warm-2); opacity:0; animation: fadein 1.2s 5.6s var(--ease) forwards; text-shadow:0 0 12px rgba(20,10,5,.9); }

.acts { position:absolute; left:var(--gutter); right:var(--gutter); bottom:30px; z-index:6; opacity:0; animation: rise 1.2s 6.0s var(--ease) forwards; }
.acts .row2 { display:flex; justify-content:center; margin-top:6px; }
.replay { position:absolute; top:44px; right:10px; z-index:20; }

</style>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
(function(){
  function arm(ph){
    function go(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ ph.classList.add('go'); }); }); }
    if (document.readyState === 'complete') go(); else addEventListener('load', go);
    ph.querySelector('#replay').addEventListener('click', function(){
      var c = ph.cloneNode(true); c.classList.remove('go'); ph.parentNode.replaceChild(c, ph); arm(c);
    });
  }
  arm(document.querySelector('.phone'));
  var m = location.hash.match(/t=([\d.]+)/);
  if (m) addEventListener('load', function(){ setTimeout(function(){ document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = parseFloat(m[1]) * 1000; }); }, 50); });
})();
</script>
