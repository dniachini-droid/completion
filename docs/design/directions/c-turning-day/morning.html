<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Morning · The Lamp Hall</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.top { position:absolute; top:44px; left:0; right:0; padding:0 12px 0 var(--gutter); display:flex; align-items:center; justify-content:space-between; z-index:6; }
.where { display:flex; align-items:baseline; gap:10px; }
.where .day { font-family:var(--life); font-size:17px; color:var(--ink-2); }
.where .dot { color:var(--ink-3); }
.where .hall { font-family:var(--place); font-size:24px; color:var(--cold-hi); text-shadow:0 0 18px rgba(143,168,255,.6), 0 0 50px rgba(143,168,255,.3); }
.maplink { height:44px; padding:0 10px; display:inline-flex; align-items:center; gap:8px; font-family:var(--life); font-size:17px; color:var(--ink-2); border-radius:22px; }
.maplink svg { width:20px; height:20px; }
.ahead { position:absolute; left:var(--gutter); right:var(--gutter); top:356px; z-index:6; }
.ahead .k { font-family:var(--life); font-style:italic; font-size:16px; color:var(--cold); }
.ahead p { font-family:var(--life); font-size:17px; color:var(--ink); line-height:1.35; margin-top:2px; text-shadow:0 1px 12px rgba(4,5,14,.9); }
.ahead p .pl { font-family:var(--place); font-size:19px; color:var(--cold-hi); letter-spacing:.01em; }
.ahead p .soft { color:var(--ink-2); }
.cap { position:absolute; left:var(--gutter); right:var(--gutter); top:412px; z-index:6; display:flex; align-items:center; gap:4px; }
.cap button { height:44px; padding:0 9px; font-family:var(--life); font-size:16px; color:var(--ink-3); position:relative; }
.cap button:first-child { margin-left:-9px; }
.cap button[aria-pressed=true] { color:var(--cold-hi); text-shadow:0 0 14px rgba(143,168,255,.7); }
.cap button[aria-pressed=true]::after { content:""; position:absolute; left:9px; right:9px; bottom:8px; height:1px; background:linear-gradient(90deg,transparent,var(--cold),transparent); box-shadow:0 0 8px var(--cold); }
.cap .from { margin-left:auto; font-family:var(--life); font-style:italic; font-size:16px; color:var(--ink-3); opacity:.85; }
.card.next { top:468px; padding:20px 20px 8px; }
.next .btn { height:58px; }
.next .eyebrow { font-family:var(--life); font-style:italic; font-size:16px; color:var(--cold); }
.next h2 { font-family:var(--life); font-weight:500; font-size:28px; line-height:1.12; letter-spacing:-.005em; color:#fff; margin:4px 0 8px; text-shadow:0 0 24px rgba(143,168,255,.35); }
.next .tease { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); margin-bottom:16px; }
.next .row2 { display:flex; justify-content:space-between; margin-top:4px; }
.next .row2 .quiet { font-size:17px; }
.jobs { position:absolute; left:var(--gutter); right:var(--gutter); top:744px; z-index:6; }
.job { display:flex; align-items:center; gap:12px; min-height:44px; border-top:1px solid rgba(143,168,255,.12); }
.job:first-child { border-top:0; }
.job .pip { width:9px; height:9px; border-radius:50%; flex:none; }
.job .pip.done { background:radial-gradient(circle,#ffe9bd,#f4c877 50%,#ec9d4c); box-shadow:0 0 10px #f4c877, 0 0 22px rgba(244,200,119,.5); }
.job .pip.open { border:1.2px solid var(--cold-dim); }
.job .name { font-family:var(--life); font-size:17px; color:var(--ink); flex:1; }
.job.isdone .name { color:var(--ink-2); }
.job .state { font-family:var(--life); font-style:italic; font-size:16px; color:var(--ink-3); }
.job.isdone .state { color:#e8c890; }

</style>
</head>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
