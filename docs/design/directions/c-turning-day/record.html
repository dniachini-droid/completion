<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>A record · The long tally</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

body { --pool-x: 50%; --pool-y: 100%; }
.top .carve.sm { display:block; margin-bottom:6px; }
.mid { display:flex; flex-direction:column; justify-content:center; }
.line { position:relative; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  -webkit-mask: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%); mask: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%); }
.line::-webkit-scrollbar { display:none; }
.strip { display:flex; align-items:flex-start; gap:10px; padding:10px 40px 6px; width:max-content; }
.cell { display:flex; flex-direction:column; align-items:center; gap:6px; width:86px; scroll-snap-align:center; position:relative; }
.cell.wide { width:132px; }
.glyph { width:76px; height:76px; overflow:visible; color:#f2f1ff; }
.wide .glyph { width:120px; height:80px; }
.read .glyph { filter: drop-shadow(0 0 6px rgba(var(--cold-rgb),.8)) drop-shadow(0 0 16px rgba(var(--cold-rgb),.35)); }
.unk .glyph { color: rgba(214,214,245,.4); }
figcaption { font-family:var(--life); font-size:18px; color:var(--ink); min-height:26px; }
figcaption.guess { font-style:italic; color:var(--ink-2); }
figcaption .q { color:var(--cold); }
figcaption.name { font-style:italic; font-size:17px; color:var(--ink-2); }
.cell.new { color:#fff; }
.cell.new .glyph { color:#fff; filter: drop-shadow(0 0 8px rgba(var(--cold-rgb),1)) drop-shadow(0 0 22px rgba(var(--cold-rgb),.7)); }
.cell.new .halo { position:absolute; left:50%; top:48px; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%;
  background: radial-gradient(circle, rgba(var(--cold-rgb),.55), transparent 65%); animation: pulse 2.6s ease-in-out infinite; pointer-events:none; }
@keyframes pulse { 0%,100% { transform:scale(.85); opacity:.6; } 50% { transform:scale(1.1); opacity:1; } }
.cell.new .cap { font-family:var(--life); font-style:italic; font-size:15px; color:var(--cold-hi); min-height:26px; }
.said { font-family:var(--life); font-size:20px; line-height:1.35; color:var(--ink); text-align:center; margin:18px var(--gutter) 0; text-shadow:0 1px 14px rgba(6,5,16,.9); }
.bank .row2 { display:flex; justify-content:space-between; }
.bank .hint { font-family:var(--life); font-size:17px; color:var(--ink-2); margin-bottom:6px; }
.tray { display:none; }
.guessing .tray { display:block; } .guessing .plain { display:none; }
.tray p { font-family:var(--life); font-size:18px; color:var(--ink); margin-bottom:10px; }
.opts { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
.opts button { min-height:48px; padding:0 18px; border-radius:24px; font-family:var(--life); font-size:18px; color:var(--ink);
  background:rgba(var(--cold-rgb),.1); box-shadow: inset 0 0 0 1px rgba(var(--cold-rgb),.35); }

</style>
</head>

/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
