<title>A record · The long tally</title>

<style>

.head { position:absolute; top:104px; left:var(--gutter); right:var(--gutter); z-index:6; }
.head .pl { font-size:36px; }
.head .sub { font-family:var(--place-caps); font-size:13px; letter-spacing:.26em; text-transform:uppercase; color:var(--glow); margin-bottom:8px; opacity:.9; }

.line { position:absolute; left:0; right:0; top:302px; height:150px; z-index:6;
  -webkit-mask: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%); mask: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%); }
.line::before { content:""; position:absolute; left:-20px; right:-20px; top:22px; height:98px; border-radius:50%;
  background: radial-gradient(60% 50% at 50% 50%, rgba(var(--glow-rgb), .22), transparent 75%); filter: blur(8px); }
.line svg { position:absolute; left:0; top:20px; width:390px; height:110px; overflow:visible; }
.mk { color: #eef0ff; }
.mk.read { filter: drop-shadow(0 0 6px rgba(var(--glow-rgb), .9)) drop-shadow(0 0 18px rgba(var(--glow-rgb), .5)); }
.mk.ringed { color:#fff; filter: drop-shadow(0 0 8px rgba(var(--glow-rgb), 1)) drop-shadow(0 0 22px rgba(var(--glow-rgb), .6)); }
.mk.unk { color: rgba(220,222,255,.42); }
.tapme { fill:none; stroke: rgba(var(--glow-rgb), .45); stroke-width:1.2; stroke-dasharray: 2 5; animation: breathe 3.4s ease-in-out infinite; }
.labels { position:absolute; left:0; right:0; top:114px; height:30px; }
.g { position:absolute; transform:translateX(-50%); font-family:var(--life); font-size:18px; color:var(--ink); white-space:nowrap; }
.g.guess { font-style:italic; color:var(--ink-2); }
.g .q { color:var(--glow); margin-left:1px; }
.g.name { font-style:italic; font-size:17px; color:var(--ink-2); }
.g.none { color:var(--ink-3); opacity:.6; }

.say { position:absolute; left:var(--gutter); right:var(--gutter); top:500px; z-index:6; text-align:center; }
.say p { font-family:var(--life); font-size:22px; line-height:1.35; color:var(--ink); text-shadow:0 1px 16px rgba(8,6,20,.8); }

.card.act { bottom:30px; padding:18px 18px 10px; }
.act .hint { font-family:var(--life); font-style:italic; font-size:16px; color:var(--ink-2); text-align:center; margin:0 0 14px; }
.act .row2 { display:flex; justify-content:center; margin-top:4px; }

</style>

/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
