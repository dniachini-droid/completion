<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>A record · The long tally</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

body { --pool-x: 50%; --pool-y: 100%; }
.top .carve.sm { display:block; margin-bottom:6px; }
.mid { display:flex; flex-direction:column; justify-content:center; }
.line { padding: 8px 10px 4px; }
.strip { display:flex; align-items:flex-start; justify-content:center; gap:4px; }
.cell { flex:1 1 0; min-width:0; max-width:72px; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; }
.cell.wide { flex:1.7 1 0; max-width:116px; }
.glyph { width:100%; max-width:60px; aspect-ratio:1; overflow:visible; color:#f2f1ff; }
.wide .glyph { max-width:104px; aspect-ratio: 3/2; }
.read .glyph { filter: drop-shadow(0 0 6px rgba(var(--cold-rgb),.8)) drop-shadow(0 0 16px rgba(var(--cold-rgb),.35)); }
figcaption { font-family:var(--life); font-size:17px; color:var(--ink); min-height:26px; white-space:nowrap; }
figcaption.guess { font-style:italic; color:var(--ink-2); }
figcaption .q { color:var(--cold-hi); }
figcaption.name { font-style:italic; font-size:16px; color:var(--ink-2); }
.cell.new { color:#fff; transform: translateY(-8px); }
.cell.new .glyph { color:#fff; filter: drop-shadow(0 0 8px rgba(var(--cold-rgb),1)) drop-shadow(0 0 22px rgba(var(--cold-rgb),.8)); }
.cell.new .halo { position:absolute; left:50%; top:30px; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%;
  background: radial-gradient(circle, rgba(var(--cold-rgb),.6), transparent 65%); animation: pulse 2.6s ease-in-out infinite; pointer-events:none; }
@keyframes pulse { 0%,100% { transform:scale(.85); opacity:.6; } 50% { transform:scale(1.12); opacity:1; } }
.cell.new .cap { font-family:var(--life); font-style:italic; font-size:16px; color:var(--cold-hi); min-height:26px; }
.said { font-family:var(--life); font-size:20px; line-height:1.35; color:var(--ink); text-align:center; margin:18px var(--gutter) 0; text-shadow:0 1px 14px rgba(6,5,16,.9); }
.bank .row2 { display:flex; justify-content:space-between; }
.bank .hint { font-family:var(--life); font-size:17px; color:var(--ink-2); margin-bottom:10px; }
.guessbtn { --glow: var(--cold); --glow-rgb: var(--cold-rgb); --btn-ink:#0b0f22; margin-bottom:4px; }
.tray { display:none; }
.guessing .tray { display:block; } .guessing .plain { display:none; }
.tray p { font-family:var(--life); font-size:18px; color:var(--ink); margin-bottom:10px; }
.opts { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
.opts button { min-height:48px; padding:0 18px; border-radius:24px; font-family:var(--life); font-size:18px; color:var(--ink);
  background:rgba(var(--cold-rgb),.1); box-shadow: inset 0 0 0 1px rgba(var(--cold-rgb),.35); }

</style>
</head>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
(function(){
  
  var ui = document.getElementById('ui'), cap = document.getElementById('newcap');
  document.getElementById('newmark').addEventListener('click', function(){ ui.classList.add('guessing'); });
  document.getElementById('guessbtn').addEventListener('click', function(){ ui.classList.add('guessing'); });
  document.querySelectorAll('.opts button').forEach(function(b){ b.addEventListener('click', function(){
    ui.classList.remove('guessing'); if (b.textContent !== 'not sure yet') { cap.textContent = b.textContent + '?'; } });
  });
})();
</script>
