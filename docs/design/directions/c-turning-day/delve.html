<style>

.rib { transform-box: view-box; transform-origin: 195px 368px; animation: pass 44s cubic-bezier(.62,.02,.93,.55) infinite; opacity:0; }
@keyframes pass {
  0% { transform: scale(.05); opacity: 0; }
  18% { opacity: .35; }
  70% { opacity: .95; }
  100% { transform: scale(1.55); opacity: 0; }
}
.where { position:absolute; top:104px; left:0; right:0; text-align:center; z-index:6; }
.where .k { font-family:var(--life); font-style:italic; font-size:16px; color:var(--ink-3); }
.where .pl { font-size:26px; margin-top:2px; }

.ring { position:absolute; left:50%; top:368px; width:262px; height:262px; margin:-131px 0 0 -131px; z-index:4; border-radius:50%; cursor:pointer; }
.ring .track, .ring .fill, .ring .fill-glow, .ring .fill-wide {
  position:absolute; inset:0; border-radius:50%;
  -webkit-mask: radial-gradient(circle, transparent 116px, #000 117.5px, #000 124px, transparent 125.5px);
          mask: radial-gradient(circle, transparent 116px, #000 117.5px, #000 124px, transparent 125.5px);
}
.ring .track { background: rgba(170,185,255,.14); }
.ring .fill {
  background: conic-gradient(from 0deg, rgba(143,168,255,.45) 0, rgba(205,216,255,.95) calc(var(--p) * 1turn - 2deg), #fff calc(var(--p) * 1turn), transparent calc(var(--p) * 1turn + .5deg));
}
.ring .fill-glow { background: inherit; }
.ring .glowwrap { position:absolute; inset:-30px; filter: blur(9px); opacity:1; mix-blend-mode:screen; }
.ring .glowwrap.wide { filter: blur(26px); opacity:.95; }
.ring .glowwrap .fill { inset:30px;
  -webkit-mask: radial-gradient(circle, transparent 100px, #000 114px, #000 128px, transparent 142px);
          mask: radial-gradient(circle, transparent 100px, #000 114px, #000 128px, transparent 142px); }
.ring .halo { position:absolute; inset:-60px; border-radius:50%; background: radial-gradient(circle, rgba(143,168,255,0) 42%, rgba(143,168,255,calc(.10 + var(--p) * .30)) 50%, rgba(143,168,255,0) 68%); }
.ring .tip { position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
  background: radial-gradient(circle, #fff, rgba(210,220,255,.8) 40%, transparent 70%);
  box-shadow: 0 0 18px 6px rgba(190,205,255,.55);
  transform: rotate(calc(var(--p) * 1turn)) translateY(-121.5px); }
.ring .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring .time { font-family:var(--life); font-weight:300; font-size:70px; line-height:1; letter-spacing:.01em; color:#f6f7ff; font-variant-numeric: tabular-nums lining-nums; text-shadow: 0 0 24px rgba(143,168,255,.8), 0 0 60px rgba(143,168,255,.4); }
.ring .left { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); margin-top:8px; }
.ring.ended .fill { background: rgba(230,236,255,.95); }
.ring.ended .halo { animation: ringbloom 2.4s var(--ease) forwards; }
@keyframes ringbloom { 0% { transform: scale(.9); opacity: 1; } 40% { transform: scale(1.25); opacity: 1; background: radial-gradient(circle, rgba(220,228,255,.55) 20%, rgba(143,168,255,.3) 50%, transparent 70%); } 100% { transform: scale(1.1); opacity: .8; } }

.ring .disc { position:absolute; inset:6px; border-radius:50%; background: radial-gradient(circle, rgba(200,212,255,calc(.04 + var(--p)*.14)) 0, rgba(143,168,255,calc(.03 + var(--p)*.08)) 60%, transparent 72%); }
.fog-front { position:absolute; inset:0; z-index:5; pointer-events:none; opacity:.55;
  -webkit-mask: radial-gradient(60% 30% at 50% 368px, #000 30%, transparent 70%); mask: radial-gradient(60% 30% at 50% 368px, #000 30%, transparent 70%); }
.fog-front svg { position:absolute; top:0; left:0; width:200%; height:100%; animation: drift 60s ease-in-out infinite alternate; }
.job { position:absolute; top:528px; left:0; right:0; text-align:center; z-index:6; }
.job h2 { font-family:var(--life); font-weight:500; font-size:25px; color:var(--ink); }
.job p { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); margin-top:2px; }

.away { position:absolute; left:var(--gutter); right:var(--gutter); bottom:40px; z-index:6; text-align:center; }
.away p { font-family:var(--life); font-size:17px; color:var(--ink-2); line-height:1.4; margin-bottom:14px; }
.away .quiet { height:52px; padding:0 28px; border-radius:26px; background:rgba(143,168,255,.07); box-shadow: inset 0 0 0 1px rgba(143,168,255,.22); color:var(--ink); }
.away small { display:block; font-family:var(--life); font-style:italic; font-size:16px; color:var(--ink-3); margin-top:10px; }

</style>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
/* the ring fills slowly with light as the minutes pass (motion only) */
(function(){
  var total = 25*60, left = 14*60 + 12, ring = document.getElementById('ring'), t = document.getElementById('time');
  function draw(){
    var m = Math.floor(left/60), s = left % 60;
    t.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    ring.style.setProperty('--p', ((total - left) / total).toFixed(4));
  }
  draw();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){ setInterval(function(){ if (left > 0) { left--; draw(); if (!left) ring.classList.add('ended'); } }, 1000); }, 3000); }); });
  /* a preview of the end: tap the ring to see it bloom */
  ring.addEventListener('click', function(){ left = 0; draw(); ring.classList.add('ended'); t.textContent = '0:00'; });
})();
</script>
