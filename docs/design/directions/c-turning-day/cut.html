<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<title>Cutting a word · The lintel</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

/* ---- the cinematic: marks cut in order, the word locks, the light answers ---- */
.phone:not(.go) * { animation-play-state: paused !important; }
.title { position:absolute; top:100px; left:var(--gutter); right:var(--gutter); z-index:6; }
.title .pl { font-size:36px; }
.title .sub { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); margin-top:6px; }

.word { position:absolute; left:0; top:182px; width:390px; height:160px; z-index:6; overflow:visible; }
.own { opacity:0; animation: fadein 1s .2s var(--ease) forwards; filter: drop-shadow(0 0 8px rgba(143,168,255,.7)); }
.blank { opacity:0; animation: fadein 1s .4s var(--ease) forwards, blankout .6s 3.5s var(--ease) forwards; }
@keyframes blankout { to { stroke-opacity:0; } }
.blank-lock { opacity:0; animation: lockon 1.6s 3.5s var(--ease) forwards; }
@keyframes lockon { 0% { opacity:0; } 20% { opacity:1; } 100% { opacity:.55; } }
.lockbloom { opacity:0; transform-box: fill-box; transform-origin:center; animation: lb 2.2s 3.5s var(--ease) forwards; }
@keyframes lb { 0% { opacity:0; transform:scale(.2); } 18% { opacity:1; } 100% { opacity:0; transform:scale(1.6); } }
.m1 path, .m2 path, .bind { stroke-dasharray: 1; stroke-dashoffset: 1; }
.m1 path { animation: draw 1.1s .9s cubic-bezier(.5,.1,.3,1) forwards; }
.m2 path { animation: draw 1.1s 2.2s cubic-bezier(.5,.1,.3,1) forwards; }
.bind { animation: draw .7s 3.5s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.m1, .m2 { transform-box: fill-box; transform-origin:center; }
.m1 { animation: slideR .7s 3.4s var(--ease) forwards; }
.m2 { animation: slideL .7s 3.4s var(--ease) forwards; }
@keyframes slideR { to { transform: translateX(5px); } }
@keyframes slideL { to { transform: translateX(-5px); } }
.tip { opacity:0; }
/* once the hall answers, the word itself warms */
.m1 path, .m2 path, .bind { transition:none; }
.word .m1 path, .word .m2 path, .word .bind { animation-name: draw, warmstroke; animation-duration: 1.1s, 2.4s; animation-fill-mode: forwards, forwards; animation-timing-function: cubic-bezier(.5,.1,.3,1), ease-in-out; }
.word .m1 path { animation-delay: .9s, 4.5s; }
.word .m2 path { animation-delay: 2.2s, 4.5s; }
.word .bind { animation-duration: .7s, 2.4s; animation-delay: 3.5s, 4.5s; }
@keyframes warmstroke { to { stroke: #ffe3a8; } }
.blank-lock { animation: lockon 1.6s 3.5s var(--ease) forwards, warmline 2.4s 4.5s ease-in-out forwards; }
@keyframes warmline { to { stroke: #f4c877; } }

.labels { position:absolute; left:0; right:0; top:312px; height:28px; z-index:6; }
.g { position:absolute; transform:translateX(-50%); font-family:var(--life); font-size:18px; color:var(--ink); opacity:0; white-space:nowrap; }
.g .q { color:var(--cold); display:inline-block; transition: none; }
.g1 { left:231px; animation: fadein .8s 1.6s var(--ease) forwards; }
.g2 { left:291px; animation: fadein .8s 2.9s var(--ease) forwards; }
.g .q { animation: dropq .8s 4.0s var(--ease) forwards; }
@keyframes dropq { to { opacity:0; transform: translateY(6px); width:0; } }
.g1 .q, .g2 .q { overflow:hidden; vertical-align:bottom; }

/* the hall answers: lamps wake one by one down the hall, the air warms */
.cup { }
.cupfire { opacity:0; animation: wakecup 1.4s var(--d) cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes wakecup { 0% { opacity:0; } 35% { opacity:1; } 100% { opacity:.95; } }
.lintel-open { opacity:0; animation: fadein 1.6s 3.9s var(--ease) forwards; }
.lintel-open-halo { opacity:0; animation: fadein 2.4s 3.9s var(--ease) forwards; mix-blend-mode:screen; }
.warmth { position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0;
  background:
    radial-gradient(90% 50% at 40% 64%, rgba(244,180,100,.42), transparent 72%),
    radial-gradient(70% 30% at 67% 262px, rgba(244,200,119,.22), transparent 75%),
    linear-gradient(180deg, rgba(236,157,76,.06) 0%, transparent 35%, rgba(236,157,76,.22) 100%);
  mix-blend-mode: screen; animation: fadein 3.6s 4.1s ease-in-out forwards; }
.flash { position:absolute; inset:0; z-index:7; pointer-events:none; opacity:0; background: radial-gradient(60% 40% at 67% 262px, rgba(230,236,255,.45), transparent 70%); animation: flash 1.6s 3.5s ease-out forwards; }
@keyframes flash { 0% { opacity:0; } 15% { opacity:1; } 100% { opacity:0; } }
.title { animation: rise 1.1s var(--ease) both; }
.title .sub .after { display:none; }

.card.done { bottom:30px; opacity:0; animation: rise 1.2s 6.2s var(--ease) forwards; padding:20px 20px 12px; }
.done .said { font-family:var(--life); font-size:20px; line-height:1.38; color:var(--ink); margin-bottom:16px; }
.done .said em { color: var(--gold-hi); font-style:italic; }
.done .btn { --glow: var(--gold); --glow-hi: var(--gold-hi); --glow-rgb: 244,200,119; color:#2a1606; }
.done .row2 { display:flex; justify-content:center; }
.replay { position:absolute; top:44px; right:10px; z-index:20; }

</style>
</head>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
/* start the moment only once the page has painted, so it never plays half-hidden */
(function(){
  var ph = document.querySelector('.phone');
  function go(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ ph.classList.add('go'); }); }); }
  if (document.readyState === 'complete') go(); else addEventListener('load', go);
  /* for stills: cut.html#t=2.5 freezes the moment at 2.5 s */
  var m = location.hash.match(/t=([\d.]+)/);
  if (m) addEventListener('load', function(){ setTimeout(function(){ document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = parseFloat(m[1]) * 1000; }); }, 50); });
})();
/* replay the moment: restart every animation on the page */
document.getElementById('replay').addEventListener('click', function(){
  var ph = document.querySelector('.phone'), c = ph.cloneNode(true);
  ph.parentNode.replaceChild(c, ph);
  c.querySelector('#replay').addEventListener('click', arguments.callee);
});
</script>
