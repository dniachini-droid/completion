<title>Cutting a word · The lintel</title>

<style>

.phone:not(.go) * { animation-play-state: paused !important; }
body { --wake0: 4.1s; --wakestep: .2s; --pool-x: 34%; --pool-y: 84%; }
.bar { justify-content:space-between; }
.bar .replay { position:absolute; left:50%; transform:translateX(-50%); }
.top .soft { display:block; margin-top:4px; }
.cutm { stroke-dasharray:1; stroke-dashoffset:1; }
.m1, .m1s { animation: draw 1.1s 0.9s cubic-bezier(.5,.1,.3,1) forwards; }
.m2, .m2s { animation: draw 1.1s 2.2s cubic-bezier(.5,.1,.3,1) forwards; }
.m1, .m2 { filter: drop-shadow(0 0 3px rgba(var(--cold-rgb), .9)); }
.word .m1, .word .m2 { animation-name: draw, warmstroke; animation-duration: 1.1s, 2.4s; animation-fill-mode: forwards, forwards; animation-timing-function: cubic-bezier(.5,.1,.3,1), ease-in-out; }
.word .m1 { animation-delay: 1.25s, 4.3999999999999995s; } .word .m2 { animation-delay: 2.5500000000000003s, 4.3999999999999995s; }
.bind { stroke-dasharray:1; stroke-dashoffset:1; animation: draw .7s 3.5s var(--ease) forwards, warmstroke 2.4s 4.3999999999999995s ease-in-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes warmstroke { to { stroke: #ffe3a8; } }
.lockflash { opacity:0; animation: flash 1.4s 3.5s ease-out forwards; mix-blend-mode:screen; }
@keyframes flash { 0% { opacity:0; } 15% { opacity:.8; } 100% { opacity:0; } }
.dust { fill:#d8dcf0; opacity:0; animation: dust 1.1s ease-in forwards; }
@keyframes dust { 0% { opacity:.9; transform: translate(0,0); } 100% { opacity:0; transform: translate(3px, 26px); } }
.cap { font-family:'Spectral',serif; font-size:16px; fill:#f4f2ff; opacity:0; }
.cap { animation: fadein .8s 1.7000000000000002s var(--ease) forwards; } .cap.c2 { animation-delay: 3.0s; }
.cap .q { fill: var(--cold); animation: fadeq .8s 4.0s var(--ease) forwards; }
@keyframes fadeq { to { opacity:0; } }
.cupfire { opacity:0; animation: wakecup 1.4s var(--d) cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes wakecup { 0% { opacity:0; } 35% { opacity:1; } 100% { opacity:.95; } }
.lintel-open { opacity:0; animation: fadein 1.8s 3.9s var(--ease) forwards; }
.pool { opacity:0; animation: poolin 3.6s 4.1s ease-in-out forwards; }
@keyframes poolin { to { opacity:.75; } }
.fog.warm { opacity:0; animation: poolin 3.6s 4.5s ease-in-out forwards; }
.bank { opacity:0; animation: rise 1.2s 5.2s var(--ease) forwards; --glow: var(--gold); --glow-hi: var(--gold-hi); --glow-rgb: var(--gold-rgb); --btn-ink:#2a1705; }
.bank .said { font-family:var(--life); font-size:20px; line-height:1.38; color:var(--ink); margin-bottom:14px; }
.bank .row2 { display:flex; justify-content:center; }

</style>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
(function(){
  function arm(ph){
    function go(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ ph.classList.add('go'); }); }); }
    if (document.readyState === 'complete') go(); else addEventListener('load', go);
    ph.querySelector('#replay').addEventListener('click', function(){ var c = ph.cloneNode(true); c.classList.remove('go'); ph.parentNode.replaceChild(c, ph); arm(c); });
  }
  arm(document.querySelector('.phone'));
  var m = location.hash.match(/t=([\d.]+)/);
  if (m) addEventListener('load', function(){ setTimeout(function(){ document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = parseFloat(m[1]) * 1000; }); }, 50); });
})();
</script>
