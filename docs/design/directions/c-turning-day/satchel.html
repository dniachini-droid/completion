<style>

.head { position:absolute; top:100px; max-width:230px; left:var(--gutter); right:var(--gutter); z-index:6; }
.head h1 { font-family:var(--life); font-weight:400; font-size:34px; line-height:1.05; color:var(--ink); text-shadow:0 0 24px rgba(var(--glow-rgb),.4); }
.head .sub { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); margin-top:4px; }

.card.list { top:372px; padding:18px 16px 16px; }
.list .k { font-family:var(--life); font-style:italic; font-size:16px; color:var(--glow); margin-left:4px; }
.list h2 { font-family:var(--life); font-weight:500; font-size:23px; line-height:1.2; color:#fff; margin:2px 0 8px 4px; }
.list ul { list-style:none; }
.list li { display:flex; align-items:center; gap:6px; min-height:46px; border-top:1px solid rgba(var(--glow-rgb),.12); }
.list li:first-child { border-top:0; }
.list .tick { width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex:none; }
.list .tick .c { width:20px; height:20px; border-radius:50%; box-shadow: inset 0 0 0 1.4px rgba(var(--glow-rgb),.6); transition: all .4s var(--ease); }
.list .t { font-family:var(--life); font-size:18px; color:var(--ink); }
.list li.done .tick .c { background: radial-gradient(circle, #fff, var(--glow-hi) 45%, var(--glow)); box-shadow: 0 0 12px rgba(var(--glow-rgb),.9), 0 0 26px rgba(var(--glow-rgb),.5); }
.list li.done .t { color:var(--ink-3); text-decoration: line-through; text-decoration-color: rgba(var(--glow-rgb),.5); text-decoration-thickness: 1px; }
.list .more { display:flex; align-items:center; gap:10px; min-height:46px; margin-bottom:12px; padding-left:14px; border-top:1px solid rgba(var(--glow-rgb),.12); font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); width:100%; text-align:left; }
.list .more svg { width:16px; height:16px; opacity:.7; }
.adds { position:absolute; left:var(--gutter); right:var(--gutter); bottom:30px; z-index:6; }

</style>
</head>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
<script>
/* ticking feels good: the circle fills with light (motion only) */
document.querySelectorAll('.list .tick').forEach(function(b){
  b.addEventListener('click', function(){ var li = b.closest('li'); li.classList.toggle('done'); b.setAttribute('aria-pressed', li.classList.contains('done')); });
});
</script>
