<head>

<title>The satchel</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>

.hall-blur { filter: blur(5px) brightness(.8); transform: scale(1.04); }
.top h1 { font-family:var(--life); font-weight:500; font-size:30px; line-height:1.1; color:#fff; }
.top .soft { display:block; margin-top:4px; max-width:190px; }
.bank { padding-top:22px; }
.bank h2 { font-family:var(--life); font-weight:500; font-size:22px; line-height:1.2; color:#fff; margin-bottom:4px; }
ul { list-style:none; }
li { display:flex; align-items:center; gap:4px; min-height:46px; border-top:1px solid rgba(var(--cold-rgb),.14); }
li:first-child { border-top:0; }
.tick { width:44px; height:44px; margin-left:-10px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex:none; }
.tick .c { width:20px; height:20px; border-radius:50%; box-shadow: inset 0 0 0 1.4px rgba(var(--cold-rgb),.65); transition: all .4s var(--ease); }
li .t { font-family:var(--life); font-size:18px; color:var(--ink); }
li.done .tick .c { background: radial-gradient(circle, #fff, var(--cold-hi) 45%, var(--cold)); box-shadow: 0 0 12px rgba(var(--cold-rgb),.9), 0 0 26px rgba(var(--cold-rgb),.5); }
li.done .t { color:var(--ink-2); text-decoration: line-through; text-decoration-color: rgba(var(--cold-rgb),.6); }
.more { display:flex; align-items:center; gap:10px; min-height:46px; width:100%; border-top:1px solid rgba(var(--cold-rgb),.14); font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-2); text-align:left; margin-bottom:12px; }
.more svg { width:16px; height:16px; opacity:.7; }
.more { margin-bottom:0; }
.addrow { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; border-top:1px dashed rgba(var(--cold-rgb),.3); font-family:var(--life); font-size:17px; color:var(--ink-2); text-align:left; }
.addrow .plus { width:24px; text-align:center; font-size:20px; color:var(--cold-hi); }

</style>
</head>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
