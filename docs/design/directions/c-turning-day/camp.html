<script>
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = document.querySelector('canvas.motes'), x = c.getContext('2d'), W, H, dpr = Math.min(2, window.devicePixelRatio || 1), P = [];

  size(); addEventListener('resize', size);
  for (var i = 0; i < 26; i++) P.push({ x: Math.random()*W, y: H*(0.3 + Math.random()*(0.7-0.3)), r: .5 + Math.random()*1.3, a: .15 + Math.random()*.45, vx: (Math.random()-.5)*.08, vy: -.02 - Math.random()*.06, p: Math.random()*6.28 });
  var last = 0;
  function tick(t){
    requestAnimationFrame(tick);
    if (t - last < 33) return; last = t;
    x.clearRect(0,0,W,H);
    for (var i = 0; i < P.length; i++) {
      var q = P[i]; q.x += q.vx + Math.sin(t/3000 + q.p)*.05; q.y += q.vy; q.p += .002;
      if (q.y < H*0.3 - 10) { q.y = H*0.7; q.x = Math.random()*W; }
      var al = q.a * (.6 + .4*Math.sin(t/1400 + q.p*3));
      x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.283); x.fillStyle = 'rgba(255,214,160,' + al.toFixed(3) + ')'; x.fill();
    }
  }
  requestAnimationFrame(tick);
})();

<script>
