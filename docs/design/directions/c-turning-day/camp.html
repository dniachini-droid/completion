<style>

.bighalo { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
.head { position:absolute; top:100px; left:var(--gutter); right:var(--gutter); z-index:6; }
.head .pl { font-size:36px; }
.head .sub { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-warm-2); margin-top:4px; }

.card.night { bottom:30px; padding:22px 20px 20px; }
.head .today { font-family:var(--life); font-size:17px; line-height:1.45; color:var(--ink-warm-2); margin-top:18px; max-width:320px; text-shadow:0 1px 14px rgba(12,6,4,.9); }
.night .bed { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
.night .bed .k { font-family:var(--life); font-style:italic; font-size:17px; color:var(--ink-warm-2); }
.night .bed .t { font-family:var(--life); font-weight:300; font-size:44px; line-height:1; color:#fff3e0; font-variant-numeric: lining-nums; text-shadow:0 0 24px rgba(244,200,119,.55); }
.night .bed .quiet { font-size:16px; }
.night .promise { font-family:var(--life); font-size:18px; line-height:1.4; color:var(--ink-warm); margin:8px 0 18px; }
.night .row2 { display:flex; justify-content:center; }

</style>

<script>
/* the light blooms where you tap (motion only) */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  document.querySelectorAll('.btn, .quiet, .tap').forEach(function(el){
    el.addEventListener('pointerdown', function(e){
      var r = el.getBoundingClientRect(), b = document.createElement('span');
      b.className = 'bloom'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden'; el.appendChild(b);
      setTimeout(function(){ b.remove(); }, 950);
    });
  });
})();
</script>
