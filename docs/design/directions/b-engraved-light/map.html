<title>The Map · Engraved Light</title>

<style>
.view{margin-top:4px;min-height:280px}
.view svg{position:absolute;inset:0;width:100%;height:100%}
.chart{transform-origin:175px 178px;animation:zoomin 1.4s var(--ease) both}
@keyframes zoomin{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.spin{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.reticle{transition:transform .5s var(--ease)}
.nn{font-family:'Cinzel',serif;font-size:15.5px;font-weight:600;letter-spacing:.12em;fill:#e8f5fb;filter:url(#halo)}
.ns{font-family:'EB Garamond',serif;font-style:italic;font-size:17.5px;fill:#b4cbd7;filter:url(#halo)}
.nn.tight{letter-spacing:.05em}
.nn.dim,.ns.dim{fill:#8ea6b3}
.node{cursor:pointer}
.node:focus{outline:none}
.card{flex:none;margin-top:14px;padding:14px 16px 16px;min-height:120px}
.card .title{font-size:21px;margin-top:6px}
.card p{margin-top:4px}
.card .btn{margin-top:12px}
.card .btn[hidden]{display:none}
</style>
</head>

          <circle class="node" data-n="mouth" cx="175" cy="48" r="28" tabindex="0" role="button" aria-label="mouth"/><circle class="node" data-n="hall" cx="175" cy="178" r="28" tabindex="0" role="button" aria-label="hall"/><circle class="node" data-n="salt" cx="58" cy="262" r="28" tabindex="0" role="button" aria-label="salt"/><circle class="node" data-n="survey" cx="318" cy="152" r="28" tabindex="0" role="button" aria-label="survey"/><circle class="node" data-n="lintel" cx="286" cy="262" r="28" tabindex="0" role="button" aria-label="lintel"/><circle class="node" data-n="stair" cx="300" cy="388" r="28" tabindex="0" role="button" aria-label="stair"/><circle class="node" data-n="door" cx="175" cy="330" r="28" tabindex="0" role="button" aria-label="door"/>
        </g>
      </g>
    </svg>
    <div class="scale"></div>
  </section>

  <section class="card plate ticks arrive d3" aria-live="polite">
    <div class="label rule" id="cl">Tap a place</div>
    <h2 class="title" id="ct" hidden></h2>
    <p class="book" id="cp">The lamp is lit. Camp is here.</p>
    <a class="btn cold" id="cb" href="cut.html" hidden>Look closer</a>
  </section>
</main>
<script>
(function(){
  var N={"mouth":[175,48],"hall":[175,178],"salt":[58,262],"survey":[318,152],"lintel":[286,262],"stair":[300,388],"door":[175,330]};
  var C={
    hall:['Tap a place',null,'The lamp is lit. Camp is here.',null],
    mouth:['Reached','The Mouth','The capped shaft, and eleven metres of ladder. The way you came in.',null],
    survey:['Reached','The Survey Cut','Someone’s camp. More of it comes to light as you come back.',null],
    salt:['Seen','The Salt Gallery','Seen from the hall. Not reached yet.',null],
    lintel:['Sealed · needs a word','The lintel','On the side wall: two marks beside a rod-shaped blank. You know two marks that might fit.','Look closer'],
    door:['Sealed · a count and a word','The great door','At the far end of the hall. A count that has not filled, and a blank that wants a word.',null],
    stair:['Not reached','The head of the stair','Beyond the lintel.',null]
  };
  if(location.hash==='#stair'){
    C.lintel=['Opened','The lintel','The stone under it has opened.',null];
    document.getElementById('lintelsub').textContent='opened';
    document.getElementById('lintelnode').setAttribute('opacity','.9');
    C.stair=['Open now','The head of the stair','Beyond the lintel: a landing, and the top of a long stair going down.',null];
    document.getElementById('stairnode').setAttribute('stroke-opacity','.8');
    document.getElementById('stairline').setAttribute('stroke-opacity','.6');
    document.getElementById('stairlabel').setAttribute('class','ns'); document.getElementById('stairnode').setAttribute('stroke-width','1.3');
  }
  var ret=document.getElementById('reticle');
  function sel(k){
    var c=C[k]; ret.style.transform='translate('+N[k][0]+'px,'+N[k][1]+'px)';
    document.getElementById('cl').textContent=c[0]; var ct=document.getElementById('ct'); if(c[1]){ct.hidden=false;ct.textContent=c[1]}else ct.hidden=true;
    document.getElementById('cp').textContent=c[2];
    var b=document.getElementById('cb'); if(c[3]){b.hidden=false;b.textContent=c[3]}else b.hidden=true;
  }
  document.querySelectorAll('.node').forEach(function(n){
    n.addEventListener('click',function(){sel(n.dataset.n)});
    n.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')sel(n.dataset.n)});
  });
  sel(location.hash==='#stair'?'stair':'hall');
})();
</script>
</body>
