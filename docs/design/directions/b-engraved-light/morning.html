<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morning · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.rail{grid-template-columns:1fr auto;padding-left:20px}
.where{font-family:var(--carve);font-size:12.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
.where b{font-weight:600;color:var(--ink);text-shadow:0 0 12px rgba(191,239,255,.3)}
.maplink{height:44px;display:flex;align-items:center;gap:8px;padding:0 8px;font-family:var(--carve);font-size:12.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--light)}
.maplink svg{width:18px;height:18px;stroke:var(--light-a);fill:none;stroke-width:1.1}

.view{position:absolute;left:var(--gutter);right:var(--gutter);top:94px;height:262px}
.ahead{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 16px;background:linear-gradient(180deg,transparent,rgba(3,6,10,.82) 45%)}
.ahead .k{font-family:var(--carve);font-size:11px;font-weight:600;letter-spacing:.32em;color:var(--light-a);text-transform:uppercase}
.ahead .v{font-family:var(--book);font-size:18px;color:var(--ink);margin-top:3px;line-height:1.25}
.ahead .v i{color:var(--light);text-shadow:0 0 10px rgba(191,239,255,.35)}

.capacity{position:absolute;left:var(--gutter);right:var(--gutter);top:364px;height:44px;display:flex;align-items:center;gap:4px}
.capacity button{height:44px;padding:0 8px;font-family:var(--carve);font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);position:relative}
.capacity button:first-child{padding-left:2px}
.capacity button[aria-pressed="true"]{color:var(--ink)}
.capacity button[aria-pressed="true"]::after{content:"";position:absolute;left:8px;right:calc(8px + .2em);bottom:9px;height:1px;background:var(--light);box-shadow:0 0 6px var(--light)}
.capacity .from{margin-left:auto;white-space:nowrap;font-family:var(--book);font-style:italic;font-size:15px;color:var(--ink-3)}

.next{position:absolute;left:var(--gutter);right:var(--gutter);top:418px;padding:18px 18px 20px}
.next h1{font-size:25px;margin-top:10px;letter-spacing:.05em}
.next .why{margin-top:6px;font-style:italic;color:var(--warm-hi);opacity:.92}
.acts{display:grid;grid-template-columns:1fr 112px;gap:14px;margin-top:18px}

.rest{position:absolute;left:var(--gutter);right:var(--gutter);top:654px}
.rest .row{min-height:54px}
.mk{width:14px;height:14px;justify-self:center}
.foot{position:absolute;left:8px;right:8px;bottom:18px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
</style>
</head>
