<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morning · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.rail{grid-template-columns:1fr auto;padding-left:20px}
.where{font-family:var(--carve);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.where b{font-weight:600;color:var(--ink);text-shadow:0 0 12px rgba(191,239,255,.3)}
.maplink{height:44px;display:flex;align-items:center;gap:7px;padding:0 10px 0 8px;font-family:var(--carve);font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--light)}
.maplink svg{width:18px;height:18px;stroke:var(--light-a);fill:none;stroke-width:1.1}

.view{min-height:150px}
.ahead{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(180deg,transparent,rgba(3,6,10,.86) 42%)}
.ahead .k{font-family:var(--carve);font-size:13px;font-weight:600;letter-spacing:.26em;color:var(--light-a);text-transform:uppercase}
.ahead .v{font-family:var(--book);font-size:18px;color:var(--ink);margin-top:2px;line-height:1.25}
.ahead .v i{color:var(--light);text-shadow:0 0 10px rgba(191,239,255,.35)}
.mote{animation:mote 16s linear infinite}
@keyframes mote{from{transform:translate(0,0);opacity:0}15%{opacity:.8}to{transform:translate(-14px,-50px);opacity:0}}

.capacity{flex:none;display:flex;flex-wrap:wrap;align-items:center;column-gap:2px;margin-top:6px}
.capacity button{height:44px;padding:0 10px;font-family:var(--carve);font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);position:relative}
.capacity button:first-child{margin-left:-10px}
.capacity button[aria-pressed="true"]{color:var(--light-hi);text-shadow:0 0 10px rgba(191,239,255,.55)}
.capacity button[aria-pressed="true"]::before{content:"";position:absolute;inset:8px 2px;border:1px solid var(--light-b);background:rgba(191,239,255,.08)}
.capacity .from{flex-basis:100%;margin-top:-8px;font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-3)}

.next{flex:none;padding:14px 16px 8px;margin-top:4px}
.next .label{color:var(--ink-3)}
.next h1{font-size:24px;margin-top:8px;letter-spacing:.05em}
.next .why{margin-top:4px;font-style:italic;color:var(--ink-2);font-size:18px}
.acts{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:14px}
.acts .cold{padding:0 16px 0 calc(16px + .24em)}
.cant{display:flex;justify-content:center;margin-top:4px}

.rest{flex:none;margin-top:10px}
.rest .row{min-height:50px}
.rest .row.done .t{color:var(--ink-2)}
.mk{width:14px;height:14px;justify-self:center}

.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
.tab{min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--carve);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.tab svg{width:20px;height:20px;stroke:var(--light-a);fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink)}
@media (max-height:800px){ .next h1{font-size:22px} .rest .row{min-height:46px} .tab{min-height:46px} }
</style>
</head>
