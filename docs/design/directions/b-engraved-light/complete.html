<html lang="en">
<head>

<title>Day Complete · Engraved Light</title>

<link rel="stylesheet" href="direction.css">

<style>
.view{position:absolute;left:var(--gutter);right:var(--gutter);top:94px;height:372px}
.drawp{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease-in-out) forwards}
.salt{opacity:0;animation:fade 1.6s var(--ease) .7s forwards}
.seam{opacity:0;animation:seam 2.4s var(--ease) 1.8s forwards}
@keyframes seam{0%{opacity:0}35%{opacity:1}100%{opacity:.6}}
.run{opacity:0;animation:run 2.2s var(--ease) 2.1s forwards}
@keyframes run{0%{opacity:0}20%{opacity:1}100%{opacity:.25}}
.t1{opacity:0;animation:arrive .9s var(--ease) 2.5s forwards}
.t2{opacity:0;animation:arrive 1s var(--ease) 3.1s forwards}
.t3{opacity:0;animation:arrive .9s var(--ease) 3.6s forwards}
.t4{opacity:0;animation:arrive .9s var(--ease) 4.6s forwards}
.drop{opacity:0;animation:drop .7s var(--ease) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.caption{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(180deg,transparent,rgba(3,6,10,.86) 55%)}
.caption .title{font-size:24px;margin-top:6px}
.caption .first{font-family:var(--book);font-style:italic;font-size:17px;color:var(--ink-2);margin-top:2px}
.enough{position:absolute;left:var(--gutter);right:var(--gutter);top:496px;text-align:center}
.enough p{font-family:var(--book);font-size:27px;line-height:1.3;color:var(--light-hi);text-shadow:0 0 22px rgba(191,239,255,.35)}
.trail{position:absolute;left:var(--gutter);right:var(--gutter);top:578px;height:92px}
.trail svg{width:100%;height:64px;overflow:visible}
.trail .note{text-align:center;font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-3);margin-top:4px}
.acts{position:absolute;left:var(--gutter);right:var(--gutter);bottom:30px}
.acts .btn{width:100%}
</style>
</head>
