<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day Complete · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.view{min-height:220px}
/* cinematic, about 5 s: the camera comes in, the face takes the light, the seam and the tally glow, then the words, then the cairn */
.push{transform-origin:200px 300px;animation:push 3.6s cubic-bezier(.2,.7,.1,1) both}
@keyframes push{from{transform:scale(1.18);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
.bloom{opacity:0;animation:bloom 3s var(--ease) 1.2s forwards}
@keyframes bloom{0%{opacity:0}40%{opacity:.8}100%{opacity:.3}}
.seal{opacity:0;animation:seal 1.6s var(--ease) 2.4s forwards}
@keyframes seal{0%{opacity:0}40%{opacity:1}100%{opacity:.85}}
.t1{opacity:0;animation:arrive .9s var(--ease) 2.6s forwards}
.t2{opacity:0;animation:arrive 1s var(--ease) 3.4s forwards}
.t3{opacity:0;animation:arrive .9s var(--ease) 4s forwards}
.t4{opacity:0;animation:arrive .9s var(--ease) 5s forwards}
.drop{opacity:0;animation:drop .7s var(--ease) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.caption{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(180deg,transparent,rgba(3,6,10,.86) 50%)}
.caption .title{font-size:24px}
.caption .first{font-family:var(--book);font-style:italic;font-size:17px;color:var(--ink-2);margin-top:2px}
.slabel{font-family:'EB Garamond',serif;font-style:italic;font-size:16px;fill:#dff7ff;paint-order:stroke;stroke:#03070b;stroke-width:3px;stroke-opacity:.8}
.enough{flex:none;text-align:center;margin-top:18px}
.enough p{font-family:var(--book);font-size:27px;line-height:1.25;color:var(--light-hi);text-shadow:0 0 22px rgba(191,239,255,.35)}
.trail{flex:none;margin-top:6px}
.trail svg{display:block;width:100%;height:66px;overflow:visible}
.trail .note{text-align:center;font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-2);margin-top:0}
.acts{flex:none;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:14px}
.acts .quiet{padding:0 4px;white-space:nowrap;font-size:17px}
</style>
</head>
