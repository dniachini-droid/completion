<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Satchel · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">
<style>
.head{position:absolute;left:var(--gutter);right:var(--gutter);top:96px;height:150px;overflow:hidden}
.head svg.art{position:absolute;inset:0;width:100%;height:100%}
.head .txt{position:absolute;left:16px;bottom:16px;right:130px}
.head .title{font-size:21px;margin-top:6px;line-height:1.2}

.list{position:absolute;left:var(--gutter);right:var(--gutter);top:266px}
.item{display:grid;grid-template-columns:44px 1fr;align-items:center;min-height:58px;border-top:1px solid var(--light-d);cursor:pointer}
.item:last-child{border-bottom:1px solid var(--light-d)}
.item .t{font-family:var(--book);font-size:19px;color:var(--ink)}
.box{width:22px;height:22px;position:relative;justify-self:start;margin-left:4px}
.box svg{width:22px;height:22px;overflow:visible}
.item.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(191,239,255,.6);text-decoration-thickness:1px}
.item .more{font-family:var(--book);font-style:italic;font-size:18px;color:var(--ink-3)}
.item .fold{width:22px;height:22px;margin-left:4px}

.add{position:absolute;left:var(--gutter);right:var(--gutter);bottom:30px;display:grid;grid-template-columns:1fr 104px;gap:12px}
.field{height:56px;border:1px solid var(--light-c);background:rgba(6,11,17,.7);display:flex;align-items:center;padding:0 16px;font-family:var(--book);font-style:italic;font-size:18px;color:var(--ink-3)}
.field::after{content:"";width:1px;height:22px;background:var(--light);margin-left:2px;box-shadow:0 0 6px var(--light);animation:blink 1.1s steps(1) infinite;order:-1;margin-right:6px}
@keyframes blink{50%{opacity:0}}
.hint{position:absolute;left:var(--gutter);right:var(--gutter);bottom:100px;text-align:center;font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-3)}
</style>
</head>
<body>
<main class="phone">

  <header class="rail arrive">
    <a class="home" href="morning.html" aria-label="Back to today"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>Today</a>
    <div class="mid">The satchel</div>
    <span style="width:44px"></span>
  </header>

  <section class="head plate ticks arrive d1">
    <svg class="art" viewBox="0 0 350 150" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
      <defs>
        <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="blur30" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
      </defs>
      <ellipse cx="290" cy="80" rx="70" ry="60" fill="#2a5068" opacity=".45" filter="url(#blur30)"/>
      <!-- the satchel, drawn in fine light-line -->
      <g fill="none" stroke="#bfefff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSoft)" class="drawn-lines">
        <path d="M256 70 C246 10 336 10 326 70" stroke-opacity=".45"/>
        <path d="M262 70 C254 20 328 20 320 70" stroke-opacity=".25"/>
        <path d="M252 72 L330 72 L330 124 Q330 134 320 134 L262 134 Q252 134 252 124 Z" stroke-opacity=".8"/>
        <path d="M249 68 Q291 60 333 68 L331 102 Q291 116 251 102 Z" stroke-opacity=".95"/>
        <path d="M255 72 Q291 65 327 72 L326 99 Q291 111 256 99 Z" stroke-opacity=".3" stroke-dasharray="1.5 2.5"/>
        <path d="M291 108 L291 124" stroke-opacity=".7"/>
        <rect x="285" y="118" width="12" height="10" rx="1.5" stroke-opacity=".9"/>
        <path d="M252 116 L330 116" stroke-opacity=".18"/>
      </g>
      <g stroke="#bfefff" stroke-opacity=".35" stroke-width=".7">
        <path d="M240 140 h100 M240 136 v8 M340 136 v8"/>
      </g>
    </svg>
    <div class="txt">
      <div class="label">A list</div>
      <h1 class="title">Sort the flat before the visit</h1>
    </div>
  </section>

  <section class="list arrive d2" aria-label="Sort the flat before the visit">
    <div class="item"><span class="box"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20" fill="none" stroke="#bfefff" stroke-opacity=".45"/><path d="M1 6V1h5M16 1h5v5M21 16v5h-5M6 21H1v-5" fill="none" stroke="#bfefff" stroke-opacity=".9"/></svg></span><span class="t">Hoover the hall</span></div>
    <div class="item"><span class="box"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20" fill="none" stroke="#bfefff" stroke-opacity=".45"/><path d="M1 6V1h5M16 1h5v5M21 16v5h-5M6 21H1v-5" fill="none" stroke="#bfefff" stroke-opacity=".9"/></svg></span><span class="t">Clear the desk</span></div>
    <div class="item"><span class="box"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20" fill="none" stroke="#bfefff" stroke-opacity=".45"/><path d="M1 6V1h5M16 1h5v5M21 16v5h-5M6 21H1v-5" fill="none" stroke="#bfefff" stroke-opacity=".9"/></svg></span><span class="t">Wash the bedding</span></div>
    <div class="item done"><span class="box"><svg viewBox="0 0 22 22" style="filter:drop-shadow(0 0 5px rgba(191,239,255,.7))"><rect x="1" y="1" width="20" height="20" fill="rgba(191,239,255,.12)" stroke="#bfefff"/><path d="M6 11.5l3.5 3.5L16.5 7" fill="none" stroke="#effbff" stroke-width="1.6"/></svg></span><span class="t">Take the bottles out</span></div>
    <div class="item"><span class="box"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20" fill="none" stroke="#bfefff" stroke-opacity=".45"/><path d="M1 6V1h5M16 1h5v5M21 16v5h-5M6 21H1v-5" fill="none" stroke="#bfefff" stroke-opacity=".9"/></svg></span><span class="t">Fix the shelf bracket</span></div>
    <div class="item"><svg class="fold" viewBox="0 0 22 22"><path d="M3 8h16M3 12h16M3 16h16" stroke="#bfefff" stroke-opacity=".3" fill="none"/><path d="M8 4l3 3 3-3" stroke="#bfefff" stroke-opacity=".6" fill="none"/></svg><span class="more">and more, folded away</span></div>
  </section>

  <p class="hint arrive d3">One line, or paste a whole list.</p>

  <div class="add arrive d3">
    <div class="field" role="textbox" aria-label="Add a line">Add a line</div>
    <button class="btn warm">Add</button>
  </div>
</main>
</body>
</html>
