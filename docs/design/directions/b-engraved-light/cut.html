<!doctype html>
<html lang="en">

<title>Cutting a Word · Engraved Light</title>

<link rel="stylesheet" href="direction.css">

<style>
.view{min-height:220px}
/* the ritual: tap mark one, tap mark two; the word locks; the light runs; the lamps wake; the stone opens */
.wake{opacity:0;transition:opacity 1s var(--ease),transform 1s var(--ease);transform:scale(.4);transform-box:fill-box;transform-origin:50% 80%}
body.answer .wake{opacity:1;transform:none;transition-delay:calc(.5s + var(--i) * .085s)}
.script{transition:stroke-opacity 2s var(--ease)}
body.lock .script{animation:runpulse 2.6s var(--ease) forwards}
body.lock .lmarks{animation:runmark 2.6s var(--ease) forwards}
@keyframes runmark{0%{opacity:1}20%{opacity:1;filter:brightness(2)}100%{opacity:1}}
@keyframes runpulse{0%{stroke-opacity:.2}20%{stroke-opacity:1}100%{stroke-opacity:.45}}
.lm1,.lm2{transition:opacity .6s}
.rodm{opacity:0;transition:opacity .5s var(--ease)}
body.c1 .rodm.c1,body.c2 .rodm.c2{opacity:1}
.shut{transition:opacity 1.4s var(--ease) 1.5s}
body.answer .shut{opacity:0}
.open{opacity:.0;transition:opacity 1.4s var(--ease) 1.5s}
body.answer .open{opacity:1}

.caption{position:absolute;left:0;bottom:0;width:min(250px,76%);padding:48px 14px 12px;background:radial-gradient(120% 100% at 0% 100%,rgba(3,6,10,.92) 40%,transparent 75%);
  opacity:0;transform:translateY(8px);transition:opacity .9s var(--ease) 2.4s,transform .9s var(--ease) 2.4s}
body.answer .caption{opacity:1;transform:none}
.caption h1{font-size:20px}
.caption p{font-size:17px;color:var(--ink-2);margin-top:3px}

.word{flex:none;margin-top:14px;padding:18px 14px 12px}
.word .label{position:absolute;left:12px;top:-9px;background:var(--stone-0);padding:0 8px 0 6px}
.rod{display:block;width:min(300px,100%);height:auto;margin:0 auto;overflow:visible}
.cutp{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease-in-out)}
body.c1 .cutp.c1,body.c2 .cutp.c2{stroke-dashoffset:0}
.lockring{opacity:0;transform:scale(1.1);transform-box:fill-box;transform-origin:center;transition:opacity .6s var(--ease),transform .6s var(--ease)}
body.lock .lockring{opacity:1;transform:none}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.key{min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--light-c);background:rgba(6,11,17,.6);
  font-family:var(--book);font-style:italic;font-size:19px;color:var(--ink);transition:border-color .3s,background .3s,opacity .3s}
.key svg{width:26px;height:26px;flex:none}
.key.ready{border-color:var(--light-a);box-shadow:0 0 16px rgba(191,239,255,.18)}
.key.done{opacity:.55;border-color:var(--light-d)}
.key .q{transition:opacity .6s}
body.answer .key{opacity:1;border-color:transparent;background:none;font-style:normal}
body.answer .key .q{opacity:0}
.hint{text-align:center;font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-2);margin-top:8px;min-height:22px}
.acts{flex:none;margin-top:12px;opacity:0;pointer-events:none;transition:opacity .8s var(--ease) 3s}
body.answer .acts{opacity:1;pointer-events:auto}
.acts .btn{width:100%}
</style>
</head>

<script>
(function(){

  k1.addEventListener('click',function(){clearTimeout(auto);cut1()});
  k2.addEventListener('click',function(){clearTimeout(auto);cut2()});

  if(reduce){ cut1(); cut2(); }
  else auto=setTimeout(function(){ cut1(); auto=setTimeout(cut2,1100); }, 2200);
})();
