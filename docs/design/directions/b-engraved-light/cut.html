<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutting a Word · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.view{position:absolute;left:var(--gutter);right:var(--gutter);top:94px;height:440px}
/* cinematic timeline (seconds): 0.8 mark one, 1.9 mark two, 3.0 lock, 3.3 light runs, 3.6 lamps wake, 5.0 the stone opens, 5.8 settle */
.cutp{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease-in-out) forwards}
.c1{animation-delay:.8s}.c2{animation-delay:1.9s}
.wallm{opacity:.45;animation:markon .6s var(--ease) forwards}
.wallm.c1{animation-delay:1.5s}.wallm.c2{animation-delay:2.6s}
@keyframes markon{to{opacity:1}}
.rodm{opacity:0;animation:fade .5s var(--ease) forwards}
.rodm.c1{animation-delay:1.6s}.rodm.c2{animation-delay:2.7s}
.runlight{opacity:0;animation:run 2.6s var(--ease) 3.25s forwards}
@keyframes run{0%{opacity:0}18%{opacity:1}100%{opacity:.32}}
.wake{opacity:0;animation:wake 1s var(--ease) forwards;animation-delay:calc(3.6s + var(--i) * .085s)}
@keyframes wake{0%{opacity:0;transform:scale(.4)}60%{opacity:1}100%{opacity:1;transform:none}}
.wake{transform-box:fill-box;transform-origin:50% 80%}
.opening{opacity:0;animation:fade 1.4s var(--ease) 5s forwards}
.shut{animation:shut 1.4s var(--ease) 5s forwards}
@keyframes shut{to{opacity:0}}
.lockring{opacity:0;animation:lock .7s var(--ease) 3s forwards;transform-origin:center;transform-box:fill-box}
@keyframes lock{0%{opacity:0;transform:scale(1.12)}100%{opacity:1;transform:none}}
.flash{opacity:0;animation:flash 1s ease 3.05s forwards}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.late{opacity:0;animation:arrive .9s var(--ease) 5.6s forwards}
.mid-note{opacity:0;animation:fade .6s var(--ease) forwards}

.caption{position:absolute;left:0;bottom:0;width:300px;padding:60px 16px 18px;background:radial-gradient(120% 100% at 0% 100%,rgba(3,6,10,.92) 40%,transparent 75%)}
.caption p{max-width:220px}
.caption h1{font-size:21px;max-width:230px}
.caption p{font-size:17px;color:var(--ink-2);margin-top:4px}

.word{position:absolute;left:var(--gutter);right:var(--gutter);top:550px;height:150px}
.word svg{display:block;margin:0 auto;overflow:visible}
.word .label{position:absolute;left:14px;top:-7px;background:var(--stone-0);padding:0 8px 0 6px}
.state{position:absolute;right:14px;top:-8px;background:var(--stone-0);padding:0 6px;font-family:var(--carve);font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
.state span{position:absolute;right:6px;top:0;white-space:nowrap}
.guess{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;fill:#e8f5fb}
.acts{position:absolute;left:var(--gutter);right:var(--gutter);bottom:30px}
.acts .btn{width:100%}
</style>
</head>
