<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Delve · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.job{flex:none;text-align:center;margin-top:-2px}
.job .t{font-family:var(--carve);font-weight:600;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.job .s{font-family:var(--book);font-style:italic;font-size:17px;color:var(--ink-2);margin-top:1px}
.view{margin-top:12px;min-height:250px}
.drift{transform-origin:175px 200px;animation:drift 40s var(--ease-in-out) infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
.mote{animation:mote 14s linear infinite}
@keyframes mote{from{transform:translate(0,0);opacity:0}15%{opacity:.8}to{transform:translate(-18px,-60px);opacity:0}}
.ring{position:absolute;left:50%;top:50%;height:min(310px,94%);aspect-ratio:1;transform:translate(-50%,-50%)}
.ring svg{width:100%;height:100%;overflow:visible}
.arc,.arcglow,.maskarc{transition:stroke-dashoffset 1s linear}
.head{transition:transform 1s linear;transform-origin:150px 150px}
.num{font-family:'Cinzel',serif;font-weight:500;font-size:56px;letter-spacing:.02em;fill:#effbff;font-variant-numeric:lining-nums tabular-nums}
.left{font-family:'EB Garamond',serif;font-style:italic;font-size:19px;fill:#b4cbd7}
.of{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.2em;fill:#93aebc}

.route{flex:none;position:relative;height:50px;margin-top:12px}
.route svg{width:100%;height:24px;display:block}
.route .lbl{position:absolute;top:24px;font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-2)}
.traveller{transition:left 1s linear}
.away{flex:none;text-align:center;color:var(--ink-2);margin:6px 8px 0}
.acts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;margin-top:14px}
.acts .quiet{justify-self:center}

/* the breather: the first delve ends here, not in day complete */
.breather{display:none}
body.b .breather{display:block}
body.b .running{display:none}
.bcopy{flex:none;text-align:center;margin-top:12px}
.bcopy .title{font-size:21px}
.bcopy p{margin-top:4px;color:var(--ink-2)}
.bacts{flex:none;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:16px}
body.b .bacts{display:grid}
.bacts .quiet{white-space:nowrap;padding:0 4px}
</style>
</head>

<script>
(function(){
  var TOTAL=1500, left=852, C=741.4, CM=854.5, paused=false, breather=false;
  var num=document.getElementById('num'), arc=document.querySelector('.arc'), glow=document.querySelector('.arcglow'),
      mask=document.querySelector('.maskarc'), head=document.querySelector('.head'), trav=document.getElementById('trav'),
      ring=document.querySelector('.ring'), btn=document.getElementById('pause');
  function pad(n){return (n<10?'0':'')+n}
  function draw(){
    var p=(TOTAL-left)/TOTAL;
    arc.style.strokeDashoffset=glow.style.strokeDashoffset=(C*(1-p)).toFixed(1);
    mask.style.strokeDashoffset=(CM*(1-p)).toFixed(1);
    head.style.transform='rotate('+(p*360).toFixed(2)+'deg)';
    if(!breather) trav.style.left='calc('+((8+192*p*.5)/3.5).toFixed(2)+'% - 8px)';
    num.textContent=Math.floor(left/60)+':'+pad(left%60);
    ring.setAttribute('aria-label',Math.floor(left/60)+' minutes '+(left%60)+' seconds left');
  }
  function toBreather(){
    breather=true; document.body.classList.add('b'); TOTAL=300; left=300;
    document.getElementById('ofword').textContent='OF 5 MINUTES'; draw();
  }
  if(location.hash==='#breather') toBreather(); else draw();
  setInterval(function(){ if(!paused && left>0){ left--; draw(); if(left===0 && !breather) toBreather(); } },1000);
  btn.addEventListener('click',function(){
    paused=!paused; btn.setAttribute('aria-pressed',paused);
    btn.querySelector('span').textContent=paused?'Resume':'Pause';
  });
})();
</script>
