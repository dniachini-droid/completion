<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Delve · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.job{position:absolute;left:var(--gutter);right:var(--gutter);top:92px;text-align:center}
.job .t{font-family:var(--carve);font-weight:500;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.job .s{font-family:var(--book);font-style:italic;font-size:17px;color:var(--ink-3);margin-top:2px}

.view{position:absolute;left:var(--gutter);right:var(--gutter);top:162px;height:404px}
.drift{transform-origin:175px 202px;animation:drift 40s var(--ease-in-out) infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
.mote{animation:mote 14s linear infinite}
@keyframes mote{from{transform:translate(0,0);opacity:0}15%{opacity:.8}to{transform:translate(-18px,-60px);opacity:0}}

.ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px}
.ring svg{width:100%;height:100%;overflow:visible}
.arc,.arcglow,.maskarc{transition:stroke-dashoffset 1s linear}
.head{transition:transform 1s linear;transform-origin:150px 150px}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.num{font-family:var(--carve);font-weight:500;font-size:58px;letter-spacing:.04em;color:var(--light-hi);line-height:1;
  text-shadow:0 0 18px rgba(191,239,255,.55),0 0 42px rgba(120,200,240,.35);font-variant-numeric:lining-nums tabular-nums;padding-left:.04em}
.num .colon{display:inline-block;transform:translateY(-.06em);opacity:.8;margin:0 .02em}
.left{font-family:var(--book);font-style:italic;font-size:18px;color:var(--ink-2);margin-top:8px}
.of{font-family:var(--carve);font-size:10.5px;font-weight:600;letter-spacing:.3em;color:var(--ink-3);text-transform:uppercase;margin-top:14px}

.route{position:absolute;left:var(--gutter);right:var(--gutter);top:580px;height:52px}
.route svg{width:100%;height:100%;overflow:visible}
.route .lbl{position:absolute;top:30px;font-family:var(--book);font-style:italic;font-size:15px;color:var(--ink-3)}
.traveller{transition:transform 1s linear}

.away{position:absolute;left:36px;right:36px;top:646px;text-align:center;color:var(--ink-2)}
.acts{position:absolute;left:var(--gutter);right:var(--gutter);bottom:30px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.acts .quiet{justify-self:center}
</style>
</head>

<script>
(function(){
  var TOTAL=1500, left=852, C=779.1, CM=892.2, paused=false;
  var num=document.getElementById('num'), arc=document.querySelector('.arc'), glow=document.querySelector('.arcglow'),
      mask=document.querySelector('.maskarc'), head=document.querySelector('.head'), trav=document.getElementById('trav'),
      ring=document.querySelector('.ring'), btn=document.getElementById('pause');
  function pad(n){return (n<10?'0':'')+n}
  function draw(){
    var p=(TOTAL-left)/TOTAL;
    arc.style.strokeDashoffset=glow.style.strokeDashoffset=(C*(1-p)).toFixed(1);
    mask.style.strokeDashoffset=(CM*(1-p)).toFixed(1);
    head.style.transform='rotate('+(p*360).toFixed(2)+'deg)';
    trav.style.transform='translateX('+(192*p*.5).toFixed(1)+'px)';
    num.innerHTML=Math.floor(left/60)+'<span class="colon">:</span>'+pad(left%60);
    ring.setAttribute('aria-label',Math.floor(left/60)+' minutes '+(left%60)+' seconds left');
  }
  setInterval(function(){ if(!paused && left>0){ left--; draw(); } },1000);
  btn.addEventListener('click',function(){
    paused=!paused; btn.setAttribute('aria-pressed',paused);
    btn.lastChild.nodeValue=paused?'Resume':'Pause';
  });
})();
</script>
