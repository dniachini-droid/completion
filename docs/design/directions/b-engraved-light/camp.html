<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camp · Engraved Light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="direction.css">

<style>
.view{position:absolute;left:var(--gutter);right:var(--gutter);top:94px;height:400px}
.flame{animation:flicker 2.8s ease-in-out infinite}
.lampglow{animation:breathe 5.5s ease-in-out infinite}
.caption{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(180deg,transparent,rgba(3,6,10,.8) 55%)}
.caption .title{font-size:24px;margin-top:6px}

.bed{position:absolute;left:var(--gutter);right:var(--gutter);top:510px;padding:16px 18px 18px}
.bed .row2{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.time{font-family:var(--carve);font-weight:500;font-size:46px;line-height:1;letter-spacing:.04em;color:var(--light-hi);text-shadow:0 0 18px rgba(191,239,255,.4);font-variant-numeric:lining-nums}
.time .colon{display:inline-block;transform:translateY(-.06em);opacity:.8}
.change{height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;border:1px solid var(--light-c);font-family:var(--carve);font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
.bed p{margin-top:14px;color:var(--ink-2)}
.acts{position:absolute;left:var(--gutter);right:var(--gutter);bottom:30px;display:grid;gap:10px}
.acts .btn{width:100%}
.acts .quiet{justify-self:center}
</style>
</head>
