<html lang="en">

<title>Camp · Engraved Light</title>

<style>
.view{min-height:200px}
.flame{animation:flicker 2.8s ease-in-out infinite}
.lampglow{animation:breathe 5.5s ease-in-out infinite}
.caption{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 12px;background:linear-gradient(180deg,transparent,rgba(3,6,10,.8) 55%)}
.caption .title{font-size:24px;margin-top:4px}
.bed{flex:none;margin-top:14px;padding:14px 16px 16px}
.bed .row2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.time{font-family:var(--carve);font-weight:500;font-size:44px;line-height:1;letter-spacing:.04em;color:var(--light-hi);text-shadow:0 0 18px rgba(191,239,255,.4);font-variant-numeric:lining-nums}
.bed p{margin-top:12px;color:var(--ink-2)}
.acts{flex:none;margin-top:16px}
.acts .btn{width:100%}
</style>
