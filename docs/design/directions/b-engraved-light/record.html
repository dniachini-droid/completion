<title>A Record · Engraved Light</title>

<style>
.head{flex:none}
.head .title{font-size:24px;margin-top:4px}
.head .by{font-family:var(--book);font-style:italic;font-size:17px;color:var(--ink-2);margin-top:1px}
.view{margin-top:12px;min-height:140px}
.panel{flex:none;margin-top:22px;padding:22px 12px 8px}
.panel svg{display:block;width:100%;height:auto;overflow:visible}
.panel .label{position:absolute;left:12px;top:-9px;background:var(--stone-0);padding:0 8px 0 6px}
.lbl-g{font-family:'EB Garamond',serif;font-style:italic;font-size:19px;fill:#e8f5fb}
.lbl-r{font-family:'EB Garamond',serif;font-size:19px;fill:#e8f5fb}
.lbl-n{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;fill:#b4cbd7}
.ann{animation:fade .6s var(--ease) both}
.cell{cursor:pointer}
.cell.sel .cb{stroke:#dff7ff;stroke-opacity:.9}
.note{font-family:'EB Garamond',serif;font-style:italic;font-size:17px;fill:#93aebc}
.say{flex:none;text-align:center;margin-top:14px}
.say .divider{margin:0 auto 12px;width:70%}
.say p{font-family:var(--book);font-size:20px;color:var(--ink);line-height:1.35}
.acts{flex:none;margin-top:auto;padding-top:14px}
.acts .btn{width:100%}
</style>

<script>
(function(){
  var notes=['Your guess: stone. It will be confirmed when a word works, or another record agrees.','Not known yet.','Confirmed: hand.','Not known yet.','A name, ringed. Not readable yet.','Not known yet.','Your guess: count.'];
  var cells=document.querySelectorAll('.cell'), note=document.getElementById('note');
  cells.forEach(function(c){ c.addEventListener('click',function(){
    cells.forEach(function(x){x.classList.remove('sel')}); c.classList.add('sel');
    var t=notes[+c.dataset.i]; note.textContent=t.length>44?t.split('.')[0]+'.':t;
  });});
})();
</script>
