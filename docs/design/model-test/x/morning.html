<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morning · The Lamp Hall</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{
  --stone-0:#05080b; --stone-1:#0a1015; --stone-2:#121b22; --stone-3:#1c2831;
  --ink:#e9eef0; --ink-2:#aebcc3; --ink-3:#7d8f98;
  --cold:#a9d6e4; --cold-hi:#dff4fa; --cold-dim:#5f8796;
  --warm:#f4b56a; --warm-hi:#ffe0ad; --warm-deep:#b8662a;
  --carve:'Cinzel',Georgia,serif; --book:'EB Garamond','Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--stone-0);overflow-x:hidden}
body{color:var(--ink);font-family:var(--book);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.phone{position:relative;width:390px;max-width:100%;height:844px;overflow:hidden;background:var(--stone-0)}

/* ---------- the hall ---------- */
.hall{position:absolute;inset:0 0 auto 0;height:470px}
.hall svg{display:block;width:100%;height:100%}
.lampglow{transform-origin:90px 340px;animation:breathe 5.2s ease-in-out infinite}
.flame{transform-origin:97px 340px;animation:flick 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.86;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.96,1.06)}60%{transform:scale(1.03,.95)}}
.seal{animation:seal 6.5s ease-in-out infinite}
@keyframes seal{0%,100%{opacity:.78}50%{opacity:1}}
canvas.motes{position:absolute;inset:0;width:390px;height:470px;pointer-events:none}

/* ---------- top bar ---------- */
.top{position:absolute;top:0;left:0;right:0;padding:50px 22px 0}
.row{display:flex;justify-content:space-between;align-items:center}
.where .day{font-family:var(--carve);font-size:13px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}
.where h1{font-family:var(--carve);font-weight:500;font-size:31px;letter-spacing:.03em;line-height:1.1;margin-top:6px;color:var(--ink);text-shadow:0 0 18px rgba(169,214,228,.25),0 1px 0 #000}
.cap{appearance:none;border:1px solid rgba(169,214,228,.28);background:rgba(8,14,19,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--ink);border-radius:999px;height:44px;padding:0 14px 0 12px;display:flex;align-items:center;gap:9px;cursor:pointer;
  font-family:var(--carve);font-size:14px;letter-spacing:.1em;box-shadow:0 0 20px rgba(169,214,228,.08) inset}
.cap{height:48px;padding:0 14px 0 13px}
.cl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.cv{font-family:var(--carve);font-size:14.5px;letter-spacing:.12em;text-transform:uppercase}
.cs{font-family:var(--book);font-style:italic;font-size:13px;letter-spacing:0;color:var(--ink-3);margin-top:2px}
.cap .tide{width:18px;height:18px}
.cap .chev{width:9px;height:9px;opacity:.6}
.cap-note{font-family:var(--book);font-style:italic;font-size:14px;color:var(--ink-3);margin-left:auto;margin-right:10px}

/* ahead tag */
.ahead{position:absolute;right:70px;top:252px;width:170px;text-align:right}
.ahead .k{font-family:var(--carve);font-size:11.5px;letter-spacing:.24em;color:var(--cold);text-transform:uppercase;opacity:.9}
.ahead .v{font-family:var(--book);font-style:italic;font-size:16px;color:var(--ink-2);line-height:1.2;margin-top:3px}

/* ---------- the day ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.day-panel,.top,.ahead,.cant{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.top{animation-delay:.05s}.ahead{animation-delay:.35s}.day-panel{animation-delay:.2s}.cant{animation-delay:.5s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.day-panel{position:absolute;left:0;right:0;top:404px;bottom:0;padding:0 22px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--carve);font-size:12.5px;letter-spacing:.28em;color:var(--warm);text-transform:uppercase}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(244,181,106,.45),rgba(244,181,106,0))}
.job{font-family:var(--carve);font-weight:500;font-size:28px;line-height:1.16;letter-spacing:.015em;margin-top:12px;color:#f6f1ea;
  text-shadow:0 0 22px rgba(244,181,106,.18)}
.why{font-family:var(--book);font-style:italic;font-size:18px;color:var(--ink-2);margin-top:8px;line-height:1.3}
.why b{font-weight:500;font-style:italic;color:var(--warm-hi)}
.acts{display:flex;gap:10px;margin-top:18px}
.btn{appearance:none;border:0;cursor:pointer;height:56px;border-radius:14px;font-family:var(--carve);font-size:16px;letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:active{transform:scale(.97)}
.go{flex:1;color:#2a1605;font-weight:600;
  background:radial-gradient(120% 140% at 50% 0%,#ffe3b3 0%,#f6bb72 45%,#d98a3f 100%);
  box-shadow:0 0 0 1px rgba(255,224,173,.55) inset,0 -6px 14px rgba(150,70,20,.35) inset,0 0 28px rgba(244,181,106,.42),0 10px 30px rgba(244,140,60,.2)}
.swap{width:104px;color:var(--ink);background:rgba(18,27,34,.7);box-shadow:0 0 0 1px rgba(169,214,228,.26) inset,0 0 18px rgba(169,214,228,.07)}
.swap svg{width:15px;height:15px}

.rule{height:14px;margin:22px 0 4px;background:
  radial-gradient(circle at 50% 50%,rgba(169,214,228,.5) 0 1.6px,transparent 2.2px),
  linear-gradient(90deg,transparent,rgba(169,214,228,.22) 30%,rgba(169,214,228,.22) 70%,transparent) center/100% 1px no-repeat}
.rest{list-style:none}
.rest li{display:flex;align-items:center;gap:14px;min-height:58px}
.cup{width:30px;height:22px;flex:none}
.rest .t{font-family:var(--book);font-size:19px;color:var(--ink);line-height:1.2}
.rest .s{font-family:var(--book);font-style:italic;font-size:15px;color:var(--ink-3);margin-top:1px}
.rest li.done .t{color:var(--ink-2)}
.rest li.done .s{color:#c9a57c}

.cant{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center}
.cant button{appearance:none;background:none;border:0;cursor:pointer;height:48px;padding:0 20px;display:flex;align-items:center;gap:10px;
  font-family:var(--book);font-size:19px;color:var(--cold);letter-spacing:.01em}
.cant button span{border-bottom:1px solid rgba(169,214,228,.35);padding-bottom:1px}
.cant svg{width:16px;height:16px}
</style>
</head>

<script>
/* Dust in the lamp light: slow, few, subtle. */
(function(){
  const c=document.querySelector('canvas.motes'); if(!c) return;
  const x=c.getContext('2d'); x.scale(2,2);
  const R=Math.random, motes=[];
  for(let i=0;i<26;i++) motes.push({x:R()*390,y:120+R()*330,r:.4+R()*1.1,vx:(R()-.5)*.06,vy:-.04-R()*.08,p:R()*6.28});
  let last=performance.now();
  function frame(t){
    const dt=Math.min(50,t-last); last=t;
    x.clearRect(0,0,390,470);
    for(const m of motes){
      m.x+=m.vx*dt*.06; m.y+=m.vy*dt*.06; m.p+=dt*.0012;
      if(m.y<100){m.y=450;m.x=R()*390}
      const dl=Math.hypot(m.x-97,m.y-330), dc=Math.hypot(m.x-200,m.y-214);
      const warm=Math.max(0,1-dl/200), cold=Math.max(0,1-dc/170);
      const a=(Math.max(warm,cold*.8))*(.45+.35*Math.sin(m.p));
      if(a<=.01) continue;
      x.fillStyle=warm>cold?`rgba(255,214,150,${a})`:`rgba(210,240,250,${a})`;
      x.beginPath(); x.arc(m.x,m.y,m.r,0,6.283); x.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
