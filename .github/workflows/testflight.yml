# The cloud Mac: packages the app and sends it to TestFlight (TECH_DECISIONS.md, ARCHITECTURE.md → "Build and release").
# Runs when a commit message contains [testflight], by hand (Actions → testflight → Run workflow),
# and on the 1st of each month so a fresh build is always inside TestFlight's 90 days.
# Needs four repository secrets, added by Dan (SECURITY_PRIVACY.md): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.
name: testflight
on:
  push:
    branches: ['main', 'claude/**']
    paths: ['app/**', '.github/workflows/testflight.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'
concurrency: { group: testflight, cancel-in-progress: false }
jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-26
    timeout-minutes: 45
    defaults: { run: { working-directory: app } }
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Web build into the iOS project
        run: npx vite build && npx cap sync ios
      - name: The App Store Connect key (from secrets; never printed)
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::The secret ASC_KEY_P8 is missing (docs/technical/APPLE_SETUP.md)"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive (signed automatically with the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION=0.1.0 \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
