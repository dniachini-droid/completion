# Compile the iOS app, unsigned, on a cloud Mac, before anything reaches main (D-095). Builds for Dan's phone come only
# from main (D-080), and the native parts (the delve's lock-screen panel, the pause on leaving the app) can't be
# previewed anywhere else, so a branch that touches them is compiled here first. Nothing is signed or uploaded.
name: iOS build check
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['app/ios/**', 'app/src/platform/**', 'app/package.json', 'app/package-lock.json', 'app/capacitor.config.ts', '.github/workflows/ios-check.yml']
  pull_request:
    branches: [main]
    paths: ['app/ios/**', 'app/src/platform/**', 'app/package.json', 'app/package-lock.json', 'app/capacitor.config.ts', '.github/workflows/ios-check.yml']
concurrency: { group: 'ios-check-${{ github.ref }}', cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync ios
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - name: Compile the app and its lock-screen panel (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E 'error:' "$RUNNER_TEMP/build.log" | sort -u | head -60; tail -40 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E 'warning: .*(Delve|SceneDelegate)' "$RUNNER_TEMP/build.log" | sort -u || true
          test -d "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app/PlugIns/DelveActivity.appex"
          echo "The app and its lock-screen panel compiled."
